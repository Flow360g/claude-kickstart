<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Summit Half Dome</title>
<meta name="description" content="A Claude kickstart for Half Dome's Client Solutions team, played as the Half Dome hike.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
/* One committed look (the hike at golden hour), so colours are set explicitly rather than themed. */
:root{
  --gold:#D2C663; --red:#8E1C02; --purple:#B0A3D0;
  --ink:#1A1917; --muted:#55524E; --card:#F7F6F5; --line:#DEDBD6; --white:#FFFFFF;
  --gold-soft:#EEE8B8; --purple-soft:#E6E0F2; --red-soft:#F1DAD3; --green:#4f6f2f;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--ink);font-family:var(--sans);overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,.node:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
code,.mono{font-family:var(--mono)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- stage (designed at 1280 x 720, letterboxed) ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;overflow:hidden;background:#cfe0ea}
#game{position:absolute;inset:0;width:1280px;height:720px;display:block}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:16px 22px;pointer-events:none;z-index:5}
.hud-left{display:flex;flex-direction:column;gap:8px}
.logo{display:block;height:auto}
.hud .logo{width:150px;margin:-6px 0 -4px -10px}
.hudrow{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.wp{display:flex;align-items:center;gap:6px;background:rgba(247,246,245,.92);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.wp svg{width:30px;height:30px}
.wp b{color:var(--red)}
.wtrack,.wfill{fill:none;stroke-width:7}
.wtrack{stroke:#E4DFD6}
.wfill{stroke:var(--red);stroke-dasharray:81.68;stroke-dashoffset:81.68;transition:stroke-dashoffset 1.2s cubic-bezier(.3,.8,.3,1)}
.wp.bump{animation:wpb .6s}
@keyframes wpb{40%{transform:scale(1.12)}}
/* Whole Potential finale */
.overlay.wpo{background:rgba(247,246,245,.97);flex-direction:column;gap:6px}
.wpo svg{width:1060px;height:265px;overflow:visible}
.wpo .cam{transform-origin:673.5px 175.5px;transform:translate(-73.5px,-25.5px) scale(2.6);transition:transform 1.4s cubic-bezier(.6,0,.2,1)}
.wpo.zoomout .cam{transform:none}
.wpo .letters{opacity:0;transition:opacity 1s}
.wpo.zoomout .letters{opacity:1}
.wpo .rtrack,.wpo .rfill{fill:none;stroke-width:27;stroke-linecap:butt}
.wpo .rtrack{stroke:#E4DFD6;transition:opacity .6s}
.wpo .rfill{stroke:var(--red)}
.wpo .msg{text-align:center;opacity:0;transform:translateY(14px) scale(.96);transition:all .6s cubic-bezier(.2,1.4,.4,1)}
.wpo.done .msg{opacity:1;transform:none}
.wpo .msg .eyebrow{justify-content:center}
.wpo .msg h2{margin:8px 0 6px;font-size:64px;line-height:1;font-weight:900;letter-spacing:-0.035em}
.wpo .msg h2 span{color:var(--red)}
.wpo .msg p{margin:0 0 18px;font-size:19px;color:var(--muted)}
.worldtag{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:rgba(247,246,245,.92);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--ink);display:inline-flex;gap:8px;align-items:center;width:max-content}
.worldtag b{color:var(--red)}
.hud-right{display:flex;gap:8px;pointer-events:auto}
.hbtn{display:flex;align-items:center;gap:7px;white-space:nowrap;background:rgba(247,246,245,.94);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:13.5px;font-weight:700;color:var(--ink);box-shadow:0 2px 0 rgba(26,25,23,.08)}
.hbtn:hover{background:var(--white);border-color:var(--gold)}
.hbtn kbd{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--ink);color:var(--card);border-radius:5px;padding:2px 6px}
.hbtn .count{font-family:var(--mono);font-size:12px;background:var(--gold);border-radius:999px;padding:1px 8px}
.hbtn.on{background:var(--purple-soft);border-color:var(--purple)}
.progress{position:absolute;left:22px;bottom:18px;z-index:5;display:flex;gap:8px;pointer-events:none}
.chip{font-family:var(--mono);font-size:12px;font-weight:600;background:rgba(247,246,245,.92);border:1px solid var(--line);border-radius:999px;padding:6px 12px;display:flex;gap:8px;align-items:center;color:var(--ink)}
.chip .dot{width:10px;height:10px;border-radius:3px;background:var(--gold);border:1px solid #9c9140}
.chip .dot.p{background:var(--purple);border-color:#7d6fa6;border-radius:50%}
.chip .dot.r{background:var(--red);border-color:var(--red);border-radius:50%}
.help{position:absolute;right:22px;bottom:18px;z-index:5;font-family:var(--mono);font-size:11.5px;color:var(--ink);background:rgba(247,246,245,.85);border:1px solid var(--line);border-radius:10px;padding:7px 11px;pointer-events:none;transition:opacity .6s}
.help kbd{font-family:var(--mono);background:var(--ink);color:var(--card);border-radius:4px;padding:1px 5px;font-size:10.5px}

.toast{position:absolute;left:50%;top:78px;transform:translate(-50%,-12px);background:var(--ink);color:var(--card);font-weight:700;font-size:15px;padding:10px 16px;border-radius:12px;opacity:0;transition:all .25s;z-index:40;pointer-events:none;display:flex;gap:10px;align-items:center;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:10px;height:10px;border-radius:50%;background:var(--gold);display:inline-block}

/* ---------- touch controls ---------- */
.touch{position:absolute;inset:auto 0 0 0;height:150px;z-index:6;display:none;pointer-events:none}
.touch.on{display:block}
.tbtn{position:absolute;bottom:26px;width:96px;height:96px;border-radius:50%;background:rgba(247,246,245,.55);border:2px solid rgba(26,25,23,.25);font:800 30px var(--sans);color:var(--ink);pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.tbtn.down{background:var(--gold)}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(26,25,23,.42);opacity:0;transition:opacity .18s}
.overlay.show{opacity:1}
.panel{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px rgba(26,25,23,.35),0 2px 0 rgba(26,25,23,.06);transform:translateY(14px) scale(.98);transition:transform .22s cubic-bezier(.2,1.4,.4,1);color:var(--ink)}
.overlay.show .panel{transform:none}
.panel:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;border-radius:20px 20px 0 0;background:var(--gold)}
.panel.red:before{background:var(--red)}
.panel.purple:before{background:var(--purple)}
.eyebrow{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.eyebrow .tag{background:var(--ink);color:var(--card);border-radius:6px;padding:3px 8px;letter-spacing:.04em}
.eyebrow .tag.gold{background:var(--gold);color:var(--ink)}
.eyebrow .tag.purple{background:var(--purple);color:var(--ink)}
.eyebrow .tag.red{background:var(--red);color:var(--white)}
.closehint{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.closehint kbd,.keys kbd{font-family:var(--mono);background:var(--white);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px;color:var(--ink)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* card */
.card{width:1200px;max-height:700px;overflow:auto;padding:26px 36px 18px;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.card:has(.cbody:not(.two)){width:860px}
.cbody{display:flex;flex-direction:column;gap:12px}
.cbody.two{display:grid;grid-template-columns:minmax(0,1fr) 590px;gap:26px;align-items:start}
.cl,.cr{display:flex;flex-direction:column;gap:11px;min-width:0}
.vwrap{position:relative;width:590px;height:189px;flex:none}
.vwrap .visual{position:absolute;left:0;top:0;transform:scale(.8);transform-origin:top left}
.cr .attach{flex-wrap:wrap}
.cr .attach .ai{flex-basis:300px}
.card h2{margin:0;font-size:32px;line-height:1.08;font-weight:800;letter-spacing:-0.02em;text-wrap:balance}
.card .lines{display:flex;flex-direction:column;gap:5px}
.card .lines p{margin:0;font-size:17.5px;line-height:1.42;color:#33312e}
.card .lines code,.list code,.check code{font-family:var(--mono);font-size:.88em;background:var(--white);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.card .steps{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 14px 10px 14px}
.card .steps ol{margin:4px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:3px}
.card .steps li{font-size:15.5px;line-height:1.4;color:#33312e}
.card .steps .lbl,.attach .lbl{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.card .tip{margin:0;font-size:15.5px;line-height:1.4;color:#33312e}
.card .tip .tl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);border-radius:5px;padding:2px 7px;margin-right:8px}
.attach{display:flex;gap:12px;align-items:center;background:var(--purple-soft);border:1px solid var(--purple);border-radius:12px;padding:10px 12px;cursor:default}
.attach .tag{flex:none;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--purple);border-radius:6px;padding:3px 8px}
.attach .ai{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.attach .ai b{font-size:15px}
.attach .peek{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attach .where{font-size:12.5px;color:var(--muted)}
.attach .acts{display:flex;gap:6px;align-items:center;flex:none}
.attach .copied{display:none}
.card .tagline{align-self:flex-start;font-family:var(--mono);font-size:13px;font-weight:600;background:var(--gold-soft);border:1px solid var(--gold);border-radius:999px;padding:4px 12px}
.talk{font-size:15px;line-height:1.4;border:1.5px dashed var(--purple);background:var(--purple-soft);border-radius:10px;padding:8px 12px;color:var(--ink)}
.talk b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.visual{position:relative;height:236px;flex:none;width:738px;background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.replay{position:absolute;right:10px;bottom:10px;z-index:3;font-family:var(--mono);font-size:11px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.replay:hover{border-color:var(--gold);color:var(--ink)}

/* item card */
.item{width:820px;padding:32px 40px 24px;display:flex;flex-direction:column;gap:13px}
.item h2{margin:0;font-size:34px;font-weight:800;letter-spacing:-0.02em}
.item .sub{margin:0;font-size:17px;color:var(--muted)}
.prompt{position:relative;margin:0;font-family:var(--mono);font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;background:var(--white);border:1px solid var(--line);border-left:5px solid var(--purple);border-radius:12px;padding:14px 18px;max-height:280px;overflow:auto;cursor:text;user-select:text;-webkit-user-select:text;color:var(--ink)}
.prompt .ph{background:var(--purple-soft);border-radius:4px;padding:0 3px;color:#4a3d78}
.btnrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:800;background:var(--ink);color:var(--card);display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.btn:hover{background:#000}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.gold:hover{background:#c4b84f}
.btn.purple{background:var(--purple);color:var(--ink)}
.btn.purple:hover{background:#9f90c7}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.try{text-decoration:none;border:1.5px solid var(--ink)}
.btn.small{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.tiny{padding:4px 9px;font-size:12px;border-radius:8px;font-weight:700}
.copied{font-family:var(--mono);font-size:13px;color:var(--green);font-weight:600}
.note{font-family:var(--mono);font-size:13px;background:var(--gold-soft);border-radius:8px;padding:4px 10px;align-self:flex-start}

/* quiz */
.quiz{width:820px;padding:34px 40px 28px;display:flex;flex-direction:column;gap:16px}
.quiz h2{margin:0;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-0.01em;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font-size:17px;font-weight:600;background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);min-height:68px;transition:transform .12s,border-color .12s}
.opt:hover{border-color:var(--ink);transform:translateY(-1px)}
.opt kbd{flex:none;font-family:var(--mono);font-size:12px;width:26px;height:26px;display:grid;place-items:center;border-radius:7px;background:var(--card);border:1px solid var(--line)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);animation:shake .35s}
.opt.right{border-color:#9c9140;background:var(--gold)}
.opt[disabled]{cursor:default}
.why{font-size:17px;line-height:1.45;border-radius:12px;padding:12px 16px;display:none}
.why.show{display:block}
.why.bad{background:var(--red-soft);border:1px solid #d9a99a}
.why.good{background:var(--gold-soft);border:1px solid var(--gold)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* campfire checklist */
.camp{width:860px;max-height:680px;padding:30px 38px 24px;display:flex;flex-direction:column;gap:14px}
.camp:before{background:var(--red)}
.camphead{display:flex;gap:20px;align-items:center}
.camphead h2{margin:4px 0 2px;font-size:34px;font-weight:900;letter-spacing:-0.02em}
.camphead p{margin:0;font-size:16px;color:var(--muted)}
.fire{position:relative;flex:none;width:96px;height:84px}
.fire .glow{position:absolute;left:50%;bottom:0;width:140px;height:90px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(210,198,99,.55),rgba(210,198,99,0));animation:glow 1.4s ease-in-out infinite alternate}
.fire .log{position:absolute;bottom:4px;left:50%;width:78px;height:12px;background:#6b4a2c;border-radius:6px}
.fire .log.a{transform:translateX(-50%) rotate(14deg)}
.fire .log.b{transform:translateX(-50%) rotate(-14deg)}
.fire .fl{position:absolute;bottom:12px;left:50%;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform-origin:bottom center}
.fire .f1{width:42px;height:62px;margin-left:-21px;background:var(--red);animation:flick .9s ease-in-out infinite alternate}
.fire .f2{width:30px;height:46px;margin-left:-15px;background:#d9762a;animation:flick .7s ease-in-out infinite alternate-reverse}
.fire .f3{width:16px;height:28px;margin-left:-8px;background:var(--gold);animation:flick .55s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) skewX(-3deg)}100%{transform:scale(.9,1.12) skewX(4deg)}}
@keyframes glow{to{opacity:.6;transform:translateX(-50%) scale(1.08)}}
.checks{display:flex;flex-direction:column;gap:8px;overflow:auto;padding-right:4px}
.check{display:flex;gap:12px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:background .2s,border-color .2s}
.check.done{background:var(--gold-soft);border-color:var(--gold)}
.check .box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--ink);background:var(--white);display:grid;place-items:center;font-weight:900;font-size:16px;color:var(--ink);padding:0}
.check.done .box{background:var(--ink);color:var(--gold)}
.check .txt{flex:1;min-width:0;font-size:16.5px;line-height:1.35}
.check.done .txt{color:#5c5a47}
.check .acts{display:flex;gap:6px;flex:none;align-items:center}
.check .copied{display:none}
.campbar{display:flex;align-items:center;gap:12px}
.meter{flex:1;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--red);border-radius:999px;transition:width .3s}

/* complete + finale */
.complete{width:700px;padding:36px 40px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.complete h2{margin:0;font-size:42px;font-weight:900;letter-spacing:-0.02em;text-wrap:balance}
.complete p{margin:0;font-size:19px;color:var(--muted)}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.finale{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:flex-end;padding-right:44px;background:linear-gradient(90deg,rgba(26,25,23,0) 0,rgba(26,25,23,.18) 40%,rgba(26,25,23,.5) 100%);opacity:0;transition:opacity .4s}
.finale.show{opacity:1}
.summit{width:700px;max-height:620px;margin-top:56px;overflow:auto;padding:24px 34px 20px;display:flex;flex-direction:column;gap:10px}
.summit .checks{overflow:visible;flex:none;gap:6px}
.summit .check{padding:7px 12px}
.summit .logo{width:130px;margin:-4px 0 -4px -8px}
.summit h2{margin:0;font-size:42px;line-height:1;font-weight:900;letter-spacing:-0.03em}
.summit h3{margin:6px 0 0;font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.summit ul{margin:0;padding-left:20px;font-size:16px;line-height:1.5}
.closing{font-size:23px;font-weight:900;letter-spacing:-0.01em;line-height:1.2;border-top:2px solid var(--ink);padding-top:12px;margin-top:4px}

/* backpack */
.pack{width:920px;max-height:660px;padding:30px 36px 22px;display:flex;flex-direction:column;gap:12px}
.pack:before{background:var(--purple)}
.pack h2{margin:0;font-size:32px;font-weight:800}
.packlist{overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:6px}
.pitem{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.pitem.locked{background:transparent;border-style:dashed;color:var(--muted);flex-direction:row;align-items:center;gap:12px;padding:10px 14px}
.pitem .ph-lock{width:30px;height:30px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-family:var(--mono);font-weight:700}
.pitem h3{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pitem h3 small{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.pitem .where{margin:0;font-size:14.5px;color:var(--muted)}
.pitem .prompt{font-size:13px;max-height:140px;padding:10px 14px}

/* title */
.title{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;padding:0 90px;background:linear-gradient(90deg,rgba(247,246,245,.97) 0,rgba(247,246,245,.9) 46%,rgba(247,246,245,0) 72%);opacity:0;transition:opacity .25s}
.title.show{opacity:1}
.title .logo{width:230px;margin:0 0 6px -16px}
.title .kick{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.title h1{margin:10px 0 8px;font-size:92px;line-height:.92;font-weight:900;letter-spacing:-0.045em;max-width:640px}
.title h1 span{display:block;color:var(--red)}
.title p{font-size:20px;color:var(--muted);margin:6px 0 24px;max-width:540px;line-height:1.4}
.title .btnrow .btn{font-size:18px;padding:14px 22px}
.keys{margin-top:26px;font-family:var(--mono);font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto auto;gap:6px 18px;width:max-content}
.keys kbd{margin-right:3px}

/* map */
.map{position:absolute;inset:0;z-index:20;opacity:0;transition:opacity .2s;background:var(--card)}
.map.show{opacity:1}
.map svg{position:absolute;inset:0;width:1280px;height:720px}
.map .mhead{position:absolute;left:40px;top:30px;display:flex;flex-direction:column;gap:6px}
.map .mhead h2{margin:0;font-size:40px;font-weight:900;letter-spacing:-0.02em}
.map .mhead p{margin:0;font-size:17px;color:var(--muted);max-width:520px}
.map .mclose{position:absolute;right:30px;top:28px;display:flex;gap:10px;align-items:center}
.node{cursor:pointer}
.node:hover .nring{stroke:var(--red)}
.nlabel{font-family:var(--sans);font-size:15px;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:#F7F6F5;stroke-width:5px;stroke-linejoin:round}
.nsub{font-family:var(--mono);font-size:11.5px;font-weight:600;fill:var(--muted);letter-spacing:.04em;paint-order:stroke;stroke:#F7F6F5;stroke-width:4px;stroke-linejoin:round}
.pulse{animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}

/* ---------- list view (a normal page, outside the stage) ---------- */
#list{position:fixed;inset:0;z-index:100;background:var(--white);overflow:auto;display:none;color:var(--ink);scroll-behavior:smooth}
#list.on{display:block}
.lv-top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.lv-bar{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.lv-bar .logo{width:118px;margin-left:-8px;flex:none}
.lv-search{flex:1;min-width:0;max-width:440px;display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 12px}
.lv-search:focus-within{border-color:var(--ink)}
.lv-search svg{width:16px;height:16px;flex:none;color:var(--muted)}
.lv-search input{flex:1;min-width:0;border:0;background:transparent;font:500 15px var(--sans);color:var(--ink);padding:10px 0;outline:none}
.lv-search kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--white)}
.lv-pot{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.lv-pot svg{width:34px;height:34px}
.lv-pot b{color:var(--red)}
.lv-bar .spacer{flex:1}
.lv-wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:0 120px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:48px}
.lv-side{position:sticky;top:76px;align-self:start;padding-top:34px;display:flex;flex-direction:column;gap:4px}
.lv-side .lbl{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 10px}
.lv-nav a{display:grid;grid-template-columns:28px 1fr;gap:2px 10px;align-items:center;text-decoration:none;color:var(--ink);border-radius:12px;padding:9px 10px;transition:background .15s}
.lv-nav a:hover{background:var(--card)}
.lv-nav a.on{background:var(--gold-soft)}
.lv-nav .n{grid-row:span 2;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--white)}
.lv-nav a.done .n{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.lv-nav .t{font-weight:800;font-size:14.5px;line-height:1.2}
.lv-nav .pg{height:4px;border-radius:999px;background:var(--line);overflow:hidden}
.lv-nav .pg i{display:block;height:100%;background:var(--red);border-radius:999px;transition:width .4s}
.lv-side .tools{display:flex;flex-direction:column;gap:6px;margin-top:18px;padding:14px 10px 0;border-top:1px solid var(--line)}
.lv-side .tools .btn{justify-content:center}
.lv-main{min-width:0;padding-top:30px}
.lv-hero{display:flex;flex-direction:column;gap:10px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.lv-hero .kick{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.lv-hero h1{margin:0;font-size:clamp(34px,5vw,56px);line-height:.95;font-weight:900;letter-spacing:-0.04em}
.lv-hero h1 span{color:var(--red)}
.lv-hero p{margin:0;font-size:17.5px;line-height:1.5;color:var(--muted);max-width:62ch}
.lv-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.lv-legend span{font-family:var(--mono);font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--card);border:1px solid var(--line)}
.lv-chips{display:none;gap:8px;overflow-x:auto;padding:4px 0 2px}
.lv-chips a{flex:none;font-family:var(--mono);font-size:12px;font-weight:600;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--white)}
.lw{padding-top:42px;scroll-margin-top:70px}
.lwh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;margin-bottom:18px}
.lwh .num{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font:900 26px var(--sans);letter-spacing:-0.03em;background:var(--ink);color:var(--gold)}
.lw:nth-of-type(3n+2) .lwh .num{color:var(--purple)}
.lw:nth-of-type(3n+3) .lwh .num{color:#e8a08c}
.lwh .wsub{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lwh h2{margin:2px 0 0;font-size:clamp(24px,3vw,32px);line-height:1.05;letter-spacing:-0.025em;text-wrap:balance}
.lwh .intro{margin:6px 0 0;font-size:15.5px;color:var(--muted)}
.lwh .stat{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);text-align:right;white-space:nowrap}
.lwh .stat b{display:block;font:900 22px var(--sans);color:var(--ink);letter-spacing:-0.02em}
.lsec{font-family:var(--mono);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--red);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.lsec:after{content:"";flex:1;height:1px;background:var(--line)}
.lcards{display:flex;flex-direction:column;gap:10px}
.lc{border:1px solid var(--line);border-radius:16px;background:var(--white);transition:border-color .2s,box-shadow .2s}
.lc:hover{border-color:#c9c4ba}
.lc[open]{border-color:var(--ink);box-shadow:0 10px 30px rgba(26,25,23,.08)}
.lc summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:30px minmax(0,1fr) auto 22px;gap:14px;align-items:center;padding:14px 16px}
.lc summary::-webkit-details-marker{display:none}
.lc .rd{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--gold);flex:none}
.lc .rd svg{width:18px;height:10px}
.lc.read .rd{background:var(--ink);color:var(--gold);font-weight:900;font-size:14px}
.lc .ttl{font-weight:800;font-size:17px;line-height:1.25}
.lc .ttl small{display:block;font-weight:500;font-size:14px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc[open] .ttl small{display:none}
.lc .pills{display:flex;gap:6px}
.lc .pill{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 8px;background:var(--purple-soft);color:#4a3d78}
.lc .pill.g{background:var(--gold-soft);color:#6b6324}
.lc .chev{width:22px;height:22px;transition:transform .25s;color:var(--muted)}
.lc[open] .chev{transform:rotate(180deg)}
.lcb{padding:0 18px 18px 60px;display:flex;flex-direction:column;gap:12px}
.lcb p{margin:0;font-size:16.5px;line-height:1.55;max-width:68ch}
.lcb code,.lw code{font-family:var(--mono);font-size:.88em;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.lsteps{background:var(--card);border-radius:12px;padding:12px 16px}
.lsteps .lbl{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.lsteps ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.lsteps li{font-size:15.5px;line-height:1.45}
.ltip{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;line-height:1.5}
.ltip .tl{flex:none;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);border-radius:5px;padding:2px 7px;margin-top:2px}
.ltag{align-self:flex-start;font-family:var(--mono);font-size:12.5px;font-weight:600;background:var(--gold-soft);border:1px solid var(--gold);border-radius:999px;padding:3px 11px}
.lprompt{border:1px solid var(--purple);background:var(--purple-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lprompt .ph1{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lprompt .ph1 b{font-size:15.5px}
.lprompt .ph1 .tg{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--purple);border-radius:6px;padding:2px 7px;margin-right:8px}
.lprompt .where{margin:0;font-size:14px;color:var(--muted)}
.lprompt .prompt{font-size:13.5px;max-height:220px;background:var(--white)}
.lprompt .prompt.short{max-height:none}
.lprompt .more{align-self:flex-start;font-family:var(--mono);font-size:11.5px;font-weight:600;background:none;border:0;padding:0;color:#4a3d78;text-decoration:underline}
.lcb .talk{max-width:68ch}
.lblock{margin-top:22px;border-radius:16px;padding:16px 18px;border:1px solid var(--line)}
.lblock h4{margin:0 0 4px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.lblock h3{margin:0 0 12px;font-size:20px;letter-spacing:-0.01em}
.lquiz{background:#fdf6f3;border-color:#ecd2c9}
.lquiz .qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px}
.lquiz .qo{text-align:left;font-size:15.5px;font-weight:600;background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink)}
.lquiz .qo:hover{border-color:var(--ink)}
.lquiz .qo.right{background:var(--gold);border-color:#9c9140}
.lquiz .qo.wrong{background:var(--red-soft);border-color:var(--red)}
.lquiz .qwhy{margin-top:10px;font-size:15.5px;line-height:1.5;display:none}
.lquiz .qwhy.show{display:block}
.lcamp{background:var(--card)}
.lcamp .camptop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.lcamp .meter{height:6px;margin:0 0 12px}
.lcamp .checks{overflow:visible}
.lcamp .check .txt{font-size:15.5px}
.lsummit{background:var(--ink);color:var(--card);border-color:var(--ink)}
.lsummit h4{color:var(--gold)}
.lsummit h3{color:var(--white);font-size:28px}
.lsummit .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px}
.lsummit .check{background:#2a2825;border-color:#3a3733;color:var(--card)}
.lsummit .check .box{border-color:var(--card);background:transparent;color:var(--gold)}
.lsummit .check.done{background:#3a3626;border-color:#6b6324}
.lsummit .check.done .box{background:var(--gold);color:var(--ink)}
.lsummit .check.done .txt{color:#cfc9a8}
.lsummit ul{margin:0;padding-left:20px;font-size:15.5px;line-height:1.7}
.lsummit .closing{border-top:2px solid var(--gold);margin-top:16px;padding-top:12px;font-size:24px}
.legg{margin-top:14px;font-size:14.5px;color:var(--muted)}
.legg summary{cursor:pointer;font-weight:700}
.lempty{display:none;text-align:center;padding:60px 0;color:var(--muted);font-size:17px}
.lv-hide{display:none!important}
mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 1px}
@media (max-width:860px){
  .lv-wrap{grid-template-columns:1fr;gap:0}
  .lv-side{display:none}
  .lv-chips{display:flex}
  .lv-pot span{display:none}
  .lv-bar .spacer{display:none}
  .lv-search{max-width:none}
  .lcb{padding:0 14px 16px}
  .lc summary{grid-template-columns:30px minmax(0,1fr) 22px;gap:10px}
  .lc .pills{display:none}
  .lwh{grid-template-columns:auto minmax(0,1fr)}
  .lwh .stat{display:none}
}
@media (max-width:560px){
  .lv-bar .logo{display:none}
  .lv-search kbd{display:none}
  .lv-bar{gap:10px}
  .lv-bar .btn{padding:7px 10px}
  .check{flex-wrap:wrap}
  .check .acts{width:100%;padding-left:40px}
}

/* ---------- card visuals (each lives in a 738 x 236 box) ---------- */
.vx{position:absolute;inset:0;font-family:var(--sans);color:var(--ink)}
.vx .lbl{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.vx svg{position:absolute;inset:0;width:100%;height:100%}
.vx svg text{font-family:var(--sans)}
.pop{opacity:0;transform:scale(.6);transform-box:fill-box;transform-origin:center;animation:popS .45s cubic-bezier(.2,1.6,.4,1) forwards}
.fadein{opacity:0;animation:fadeIn .45s forwards}
.rise{opacity:0;transform:translateY(10px);animation:popIn .45s forwards}
@keyframes popS{to{opacity:1;transform:scale(1)}}
@keyframes popIn{to{opacity:1;transform:none}}
@keyframes fadeIn{to{opacity:1}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* prefs */
.v-prefs .win{position:absolute;left:24px;top:22px;width:430px;height:190px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.v-prefs .bar{height:30px;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--white)}
.v-prefs .bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.v-prefs .bar span{margin-left:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.v-prefs .ta{margin:12px;height:120px;background:var(--white);border:1.5px solid var(--gold);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.5}
.v-prefs .caret{display:inline-block;width:7px;height:15px;background:var(--ink);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.v-prefs .sw{position:absolute;left:38px;bottom:30px;display:flex;gap:8px}
.v-prefs .sw b{width:26px;height:26px;border-radius:7px;transform:scale(0);transition:transform .35s cubic-bezier(.2,1.6,.4,1);border:1px solid rgba(0,0,0,.12)}
.v-prefs .sw b.on{transform:scale(1)}
.v-prefs .reach{position:absolute;right:24px;top:22px;width:240px;height:190px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.v-prefs .pill{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:800;font-size:18px;color:#a9a49c;background:var(--white);display:flex;justify-content:space-between;align-items:center;transition:all .35s}
.v-prefs .pill:after{content:"";width:12px;height:12px;border-radius:50%;background:var(--line);transition:all .35s}
.v-prefs .pill.on{border-color:#9c9140;background:var(--gold);color:var(--ink);transform:translateX(-6px)}
.v-prefs .pill.on:after{background:var(--red)}
/* about */
.v-about .pg{position:absolute;left:40px;top:22px;width:170px;height:192px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:6px;transform-origin:top left;animation:pgShrink 1.4s .5s ease-in-out forwards}
.v-about .pg i{display:block;height:6px;border-radius:3px;background:#d5d1ca}
.v-about .pg i:nth-child(3n){width:70%}
@keyframes pgShrink{to{opacity:.25;transform:scale(.82)}}
.v-about .x{position:absolute;left:60px;top:96px;font-family:var(--mono);font-weight:700;color:var(--red);font-size:13px;opacity:0;animation:fadeIn .4s 1.6s forwards;background:var(--white);border:1.5px solid var(--red);border-radius:6px;padding:2px 8px;transform:rotate(-6deg)}
.v-about .arrow{position:absolute;left:236px;top:104px;font-size:34px;color:var(--muted)}
.v-about .tight{position:absolute;left:290px;top:38px;width:410px;border:2px solid var(--gold);border-radius:12px;background:var(--white);padding:16px 18px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:150px}
.v-about .tight .lbl{width:100%}
.v-about .tight span{font-weight:700;font-size:15px;border-radius:999px;padding:6px 12px;background:var(--gold-soft);border:1px solid var(--gold);opacity:0;transform:translateY(8px);animation:popIn .4s forwards}
.v-about .ok{position:absolute;left:290px;top:200px;font-family:var(--mono);font-size:12px;font-weight:600;opacity:0;animation:fadeIn .4s 3.2s forwards}
/* memory */
.v-mem .toggles{position:absolute;left:30px;top:30px;width:270px;display:flex;flex-direction:column;gap:14px}
.v-mem .tg{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sw2{width:44px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .3s;flex:none}
.sw2:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--white);transition:left .3s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw2.on{background:var(--red)}
.sw2.on:after{left:23px}
.v-mem .mem{position:absolute;left:330px;top:22px;width:380px;height:192px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--white);display:flex;flex-direction:column;gap:8px}
.v-mem .m{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;background:var(--purple-soft);border-radius:8px;padding:7px 10px;opacity:0;transform:translateX(12px);transition:all .4s}
.v-mem .m.on{opacity:1;transform:none}
.v-mem .m .pen{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid #c9c0e3;border-radius:6px;padding:1px 6px;background:var(--white)}
.v-mem .m.edit{outline:2px solid var(--gold);background:var(--white)}
/* import */
.v-imp .box{position:absolute;top:28px;width:220px;height:180px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:14px}
.v-imp .box h4{margin:0;font-size:18px}
.v-imp .a{left:40px}
.v-imp .b{right:40px;border-color:var(--gold);background:var(--white)}
.v-imp .rail{position:absolute;left:270px;right:270px;top:118px;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.v-imp .tok{position:absolute;left:60px;font-weight:700;font-size:14px;background:var(--purple);border-radius:999px;padding:6px 12px;opacity:0;animation:fly 1.5s ease-in-out forwards;white-space:nowrap}
@keyframes fly{0%{opacity:0;transform:translateX(0)}12%{opacity:1}85%{opacity:1}100%{opacity:1;transform:translateX(430px)}}
/* folders */
.v-fold .grid{position:absolute;left:40px;right:40px;top:58px;display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.v-fold .f{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:14px;transition:opacity .4s}
.v-fold .f .ic{position:relative;width:84px;height:64px}
.v-fold .f .ic:before{content:"";position:absolute;left:0;top:0;width:36px;height:14px;border-radius:5px 5px 0 0;background:#cfc9be}
.v-fold .f .ic:after{content:"";position:absolute;left:0;top:9px;right:0;bottom:0;border-radius:6px;background:#e4dfd6;border:1px solid #cfc9be}
.v-fold .f.t .ic:before{background:#b8ad4f}
.v-fold .f.t .ic:after{background:var(--gold);border-color:#9c9140}
.v-fold .f .mk{position:absolute;right:-8px;bottom:-8px;z-index:2;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:900;transform:scale(0);transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.v-fold .f.t .mk{background:var(--ink);color:var(--gold)}
.v-fold .f.n .mk{background:var(--white);border:1.5px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11px}
.v-fold .f.show .mk{transform:scale(1)}
.v-fold .f.n.show{opacity:.45}
.v-fold .cap{position:absolute;left:0;right:0;bottom:20px;text-align:center}
/* bars (Opus 5.5) */
.v-bars{padding:22px 30px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.v-bars .grp{display:flex;flex-direction:column;gap:10px}
.v-bars h5{margin:0;font-size:15px;font-weight:800}
.v-bars .row{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;font-weight:600}
.v-bars .track{height:30px;background:var(--card);border-radius:8px;position:relative}
.v-bars .b{height:100%;border-radius:8px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.v-bars .b.old{background:#cfc9be}
.v-bars .b.new{background:var(--red)}
.v-bars .big{font-size:28px;font-weight:900;letter-spacing:-0.02em;opacity:0;transition:opacity .5s .9s}
.v-bars.go .big{opacity:1}
.v-bars .date{position:absolute;right:16px;top:14px;font-family:var(--mono);font-size:11px;font-weight:700;background:var(--gold);border-radius:6px;padding:3px 8px}
/* incognito */
.v-incog{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:26px 30px}
.v-incog .chat{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;opacity:0;transform:translateY(8px);animation:popIn .45s forwards}
.v-incog .chat.n{background:var(--card);border:1.5px solid var(--line)}
.v-incog .chat.i{background:var(--ink);color:var(--card);animation-delay:.6s}
.v-incog .chat.i .lbl{color:#b9b3a8}
.v-incog .bub{align-self:flex-end;background:var(--purple-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:700;font-size:15px}
.v-incog .mem{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--green);opacity:0;animation:fadeIn .4s 1.2s forwards}
.v-incog .mem.off{color:var(--gold);animation-delay:1.6s}
/* effort */
.v-effort .menu{position:absolute;left:30px;top:24px;width:250px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px;display:flex;flex-direction:column;gap:6px}
.v-effort .mi{font-weight:700;font-size:15px;padding:8px 10px;border-radius:8px;background:var(--white);display:flex;justify-content:space-between;align-items:center}
.v-effort .mi span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.v-effort .mi.on{background:var(--red);color:var(--white)}
.v-effort .mi.on span{color:var(--red-soft)}
.v-effort .dial{position:absolute;left:310px;right:30px;top:24px;display:flex;flex-direction:column;gap:12px}
.v-effort .lv{display:flex;gap:6px}
.v-effort .lv button{flex:1;border:1.5px solid var(--line);background:var(--white);border-radius:10px;padding:10px 4px;font-weight:800;font-size:13px;transition:all .3s}
.v-effort .lv button.on{background:var(--gold);border-color:#9c9140}
.v-effort .bar{height:12px;border-radius:999px;background:var(--card);overflow:hidden}
.v-effort .bar i{display:block;height:100%;background:var(--red);border-radius:999px;transition:width .5s}
.v-effort .cap{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted)}
/* thumb */
.v-thumb{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:18px 26px}
.v-thumb .side{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;justify-content:space-between;background:var(--card)}
.v-thumb .side h5{margin:0;font-size:20px;font-weight:800;line-height:1.15}
.v-thumb .side .eg{font-size:14px;color:var(--muted);line-height:1.4}
.v-thumb .pick{align-self:flex-start;font-weight:900;font-size:20px;border-radius:12px;padding:8px 16px}
.v-thumb .pick.o{background:var(--red);color:var(--white)}
.v-thumb .pick.s{background:var(--gold);color:var(--ink)}
/* chips flowing (draft, setup) */
.flowrow{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepbox{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:14px 12px;text-align:center;opacity:.35;transition:all .4s}
.stepbox.on{opacity:1;border-color:var(--ink);background:var(--white)}
.stepbox.hot{background:var(--gold);border-color:#9c9140}
.stepbox b{display:block;font-size:17px}
.stepbox span{font-size:13px;color:var(--muted)}
.arrowc{flex:none;font-size:22px;color:var(--muted)}
.stamp{position:absolute;left:30px;bottom:18px;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--red);border:2px solid var(--red);border-radius:6px;padding:3px 10px;transform:rotate(-5deg) scale(1.6);opacity:0;transition:all .35s cubic-bezier(.2,1.6,.4,1)}
.stamp.on{opacity:1;transform:rotate(-5deg) scale(1)}
.people{display:flex;gap:16px}
.person{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:700}
.person .av{width:46px;height:46px;border-radius:50%;background:var(--purple-soft);border:2px solid var(--line);display:grid;place-items:center;font-weight:900;transition:all .3s}
.person.on .av{background:var(--purple);border-color:#6f61a0}
.person .st{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.person.on .st{color:var(--green)}
/* design system */
.v-design .notes{position:absolute;left:28px;top:24px;width:230px;height:188px;background:#fffef6;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-line;color:#3d3a35}
.v-design .notes .fn{display:block;font-weight:700;color:var(--muted);font-size:11px;margin-bottom:4px}
.v-design .mid{position:absolute;left:272px;top:96px;width:140px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted)}
.v-design .mid i{display:block;height:2px;background:var(--ink);margin:8px 0;transform-origin:left;transform:scaleX(0);animation:grow .6s .3s forwards}
@keyframes grow{to{transform:scaleX(1)}}
.v-design .slide{position:absolute;right:28px;top:24px;width:300px;height:188px;background:#F7F6F5;border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:18px 18px 0}
.v-design .slide .band{position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--gold)}
.v-design .slide .ey{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--red);letter-spacing:.1em}
.v-design .slide h6{margin:6px 0;font-size:26px;line-height:1;font-weight:900;letter-spacing:-0.02em}
.v-design .slide p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4}
.v-design .slide .sw{position:absolute;left:18px;bottom:14px;display:flex;gap:6px}
.v-design .slide .sw i{width:20px;height:20px;border-radius:5px}
.v-design .slide .hd{position:absolute;right:12px;bottom:12px;width:70px}
/* anatomy */
.v-anat .tree{position:absolute;left:24px;top:22px;width:420px;height:192px;background:var(--ink);border-radius:12px;padding:16px 18px;font-family:var(--mono);font-size:14px;line-height:1.85;color:#e9e5dc}
.v-anat .tree div{opacity:0;transform:translateX(-6px);animation:popIn .35s forwards}
.v-anat .tree b{color:var(--gold);font-weight:600}
.v-anat .tree em{font-style:normal;color:#9a958b}
.v-anat .side{position:absolute;right:24px;top:22px;width:250px;height:192px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.v-anat .q{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;background:var(--card);opacity:.4;transition:all .4s}
.v-anat .q.on{opacity:1;border-color:var(--gold);background:var(--gold-soft)}
.v-anat .q small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:3px}
/* lanes */
.v-lanes .proj{position:absolute;left:22px;top:20px;bottom:20px;width:150px;border-radius:12px;background:var(--ink);color:var(--card);padding:14px}
.v-lanes .proj b{display:block;font-size:20px;margin-top:4px}
.v-lanes .proj .lbl{color:#b9b3a8}
.v-lanes .ln{position:absolute;left:190px;right:22px;height:44px;border-radius:12px;border:1.5px dashed var(--line);display:flex;align-items:center;gap:8px;padding:0 12px}
.v-lanes .ln .lbl{width:170px;flex:none}
.v-lanes .ln.l1{top:20px;background:var(--gold-soft);border-color:var(--gold);border-style:solid}
.v-lanes .ln.l2{top:72px;background:var(--purple-soft);border-color:var(--purple);border-style:solid}
.v-lanes .ln.l3{top:124px}
.v-lanes .ln.l4{top:176px}
.v-lanes .tk{font-weight:800;font-size:14px;background:var(--white);border:1.5px solid var(--ink);border-radius:999px;padding:5px 12px;opacity:0;transform:translateY(-20px);animation:popIn .45s forwards}
/* docs (playbook, context) */
.doc{position:absolute;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 6px 16px rgba(26,25,23,.08)}
.doc h6{margin:0 0 6px;font-size:14px;font-weight:900}
.doc .sec{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--red);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.doc .ln2{height:6px;border-radius:3px;background:#e2ddd5;margin-top:5px}
.doc .kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;border-bottom:1px solid var(--card);padding:3px 0}
.doc .kv span:last-child{font-family:var(--mono);font-size:11px;color:var(--muted)}
/* MI hero */
.v-mi .sheet{position:absolute;left:18px;top:18px;width:300px;height:200px;border:1px solid #c9c4ba;border-radius:6px;background:var(--white);overflow:hidden;font-family:var(--mono);font-size:10.5px}
.v-mi .sheet .r{display:grid;grid-template-columns:56px 1fr 52px 52px;height:20px;border-bottom:1px solid #ece8e1;transition:opacity .3s}
.v-mi .sheet .r span{border-right:1px solid #ece8e1;padding:3px 5px;white-space:nowrap;overflow:hidden}
.v-mi .sheet .r.ban{background:#efe9d5;font-weight:700;display:block;padding:3px 6px}
.v-mi .sheet .r.hd{background:#f4f2ee;font-weight:700;color:var(--muted)}
.v-mi .sheet .r.gone{opacity:.15}
.v-mi .sheet .bad{background:#f6cfc4;color:var(--red);animation:fl .5s 3 alternate}
@keyframes fl{from{background:#fff}to{background:#f6cfc4}}
.v-mi .fly{position:absolute;left:24px;width:200px;height:20px;border-radius:5px;background:var(--gold-soft);border:1px solid var(--gold);font-family:var(--mono);font-size:10.5px;padding:3px 6px;transition:transform .9s cubic-bezier(.5,0,.2,1),opacity .3s;z-index:3;white-space:nowrap;overflow:hidden}
.v-mi .board{position:absolute;right:18px;top:18px;width:380px;height:200px;border-radius:8px;border:1px solid var(--line);background:#f6f7fb;padding:8px 10px;overflow:hidden}
.v-mi .board .gt{font-size:12px;font-weight:800;margin:4px 0 4px;display:flex;align-items:center;gap:6px}
.v-mi .board .gt i{width:4px;height:14px;border-radius:2px;display:inline-block}
.v-mi .board .it{display:grid;grid-template-columns:1fr 92px;gap:6px;align-items:center;background:var(--white);border-left:4px solid var(--purple);border-radius:4px;height:24px;margin-bottom:3px;padding:0 6px;font-size:11px;font-weight:600;opacity:0;transition:opacity .3s}
.v-mi .board .it.on{opacity:1}
.v-mi .board .it .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.v-mi .st{font-size:10px;font-weight:700;color:var(--white);border-radius:3px;text-align:center;padding:3px 0}
.v-mi .qa{flex:none;font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--white);background:var(--red);border-radius:3px;padding:1px 5px}
.v-mi .typing{position:absolute;right:18px;top:18px;width:380px;height:200px;border:1.5px dashed var(--line);border-radius:8px;padding:16px;font-family:var(--mono);font-size:13px;line-height:1.6;color:var(--muted)}
.v-mi .typing .slow{color:var(--red);font-weight:700;display:block;margin-top:10px}
/* counters */
.v-count{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:30px}
.v-count .c{border-radius:14px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.v-count .c:nth-child(1){background:var(--card);border:1.5px solid var(--line)}
.v-count .c:nth-child(2){background:var(--gold-soft);border:1.5px solid var(--gold)}
.v-count .c:nth-child(3){background:var(--red-soft);border:1.5px solid #d9a99a}
.v-count .n{font-size:64px;font-weight:900;letter-spacing:-0.04em;line-height:1;font-variant-numeric:tabular-nums}
.v-count .c:nth-child(3) .n{color:var(--red)}
.v-count .t{font-size:16px;font-weight:700}
/* wip */
.v-wip .note{position:absolute;left:22px;top:44px;width:190px;height:150px;background:#fffef6;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.45;align-self:auto}
.v-wip .note b{font-size:13px}
.v-wip .note .int{color:var(--red);font-weight:700}
.v-wip .dest{position:absolute;left:470px;width:246px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:800;font-size:14px}
.v-wip .dest .sp{font-family:var(--mono);font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 7px;opacity:0;transform:scale(1.6) rotate(-6deg);transition:all .35s cubic-bezier(.2,1.6,.4,1)}
.v-wip .dest.on .sp{opacity:1;transform:scale(1) rotate(-4deg)}
.v-wip .dest .sp.saved{background:var(--ink);color:var(--gold)}
.v-wip .dest .sp.upd{background:var(--purple);color:var(--ink)}
.v-wip .dest .sp.draft{background:var(--gold);color:var(--ink)}
.v-wip .pkt{position:absolute;left:214px;width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);opacity:0;z-index:2}
.v-wip .pkt.int{background:var(--red);border-color:var(--red)}
.v-wip .bounce{position:absolute;left:400px;top:150px;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--red);opacity:0;transition:opacity .3s}
/* traps */
.v-traps{display:flex;flex-direction:column;gap:10px;padding:20px 26px}
.v-traps .tr{display:grid;grid-template-columns:1fr 30px 1fr;align-items:center;gap:10px;opacity:0;transform:translateY(8px);animation:popIn .4s forwards}
.v-traps .in{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.v-traps .out{border-radius:10px;padding:10px 12px;font-size:15px;font-weight:800}
.v-traps .ar{text-align:center;font-size:20px;color:var(--muted)}
/* office windows */
.v-win .w{position:absolute;left:24px;right:24px;top:20px;bottom:20px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--white)}
.v-win .tb{height:30px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.v-win .tb i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.v-win .tb .url{margin-left:10px;background:var(--white);border:1px solid var(--line);border-radius:6px;padding:2px 10px;flex:1;max-width:320px}
.v-win .pane{position:absolute;top:30px;right:0;bottom:0;width:240px;border-left:1px solid var(--line);background:#fbfaf8;padding:12px;display:flex;flex-direction:column;gap:8px}
.v-win .msg{font-size:12.5px;line-height:1.4;border-radius:10px;padding:8px 10px;opacity:0;transform:translateY(6px);animation:popIn .4s forwards}
.v-win .msg.u{background:var(--purple-soft);align-self:flex-end;max-width:85%}
.v-win .msg.c{background:var(--white);border:1px solid var(--line)}
.v-win .body{position:absolute;top:30px;left:0;right:240px;bottom:0;padding:14px}
.v-win .tile{border:1px solid var(--line);border-radius:8px;height:44px;margin-bottom:8px;background:var(--card);display:flex;align-items:center;padding:0 12px;gap:10px;font-size:12px;font-weight:700}
.v-win .tile .spark{flex:1;height:20px;background:linear-gradient(90deg,transparent,transparent);border-bottom:2px solid var(--purple)}
.v-win .cursor{position:absolute;width:14px;height:14px;border-left:3px solid var(--ink);border-top:3px solid var(--ink);transform:rotate(-15deg);transition:all .8s ease-in-out;z-index:4}
.v-win .grid{display:grid;grid-template-columns:40px repeat(4,1fr);font-family:var(--mono);font-size:11px}
.v-win .grid span{border-right:1px solid #ece8e1;border-bottom:1px solid #ece8e1;padding:4px 6px;height:24px;white-space:nowrap;overflow:hidden}
.v-win .grid .h{background:var(--card);color:var(--muted);font-weight:700;text-align:center}
.v-win .grid .sel{outline:2px solid var(--green);outline-offset:-2px;background:#eef5e6;font-weight:700}
.v-win .fx{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line)}
.v-win .fx b{font-style:italic;color:var(--muted)}
.v-win .page{padding:22px 26px;font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.7;color:#2b2926}
.v-win del{color:var(--red);text-decoration-thickness:2px;opacity:0;transition:opacity .4s}
.v-win ins{color:#2f5f9e;text-decoration:underline;text-decoration-thickness:2px;opacity:0;transition:opacity .4s}
.v-win .on{opacity:1}
.v-win .accept{display:flex;gap:8px;margin-top:10px}
/* origin */
.v-origin svg{position:absolute;inset:0;width:100%;height:100%}
/* models chart */
.v-models .bub{transition:all .4s}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage" aria-label="Summit Half Dome game">
    <canvas id="game" width="1280" height="720"></canvas>
    <div class="hud">
      <div class="hud-left">
        <img class="logo" id="hudLogo" alt="halfdome" width="150" height="38">
        <div class="hudrow"><div class="worldtag" id="worldtag"></div>
        <div class="wp" id="wp" title="Whole Potential: your progress through the hike"><svg viewBox="0 0 40 40" aria-hidden="true"><path class="wtrack" d="M 7 20 A 13 13 0 0 1 33 20 A 13 13 0 0 1 7 20"/><path class="wfill" id="wpFill" d="M 7 20 A 13 13 0 0 1 33 20 A 13 13 0 0 1 7 20"/></svg><span>Whole Potential <b id="wpPct">0%</b></span></div></div>
      </div>
      <div class="hud-right">
        <button class="hbtn" id="btnMap" type="button" title="World map (M)">Map <kbd>M</kbd></button>
        <button class="hbtn" id="btnPack" type="button" title="Backpack (B)">Backpack <span class="count" id="packCount">0</span> <kbd>B</kbd></button>
        <button class="hbtn" id="btnList" type="button" title="List view (L)">List view <kbd>L</kbd></button>
        <button class="hbtn" id="btnPresenter" type="button" title="Presenter talk tracks (P)" aria-pressed="false">Presenter <kbd>P</kbd></button>
        <button class="hbtn" id="btnSound" type="button" title="Sound effects" aria-pressed="true">Sound on</button>
        <button class="hbtn" id="btnMusic" type="button" title="Music" aria-pressed="true">Music on</button>
      </div>
    </div>
    <div class="progress" id="progress"></div>
    <div class="help" id="help"><kbd>&larr;</kbd><kbd>&rarr;</kbd> move &nbsp; <kbd>Space</kbd> jump &nbsp; <kbd>E</kbd> read a marker &nbsp; <kbd>Esc</kbd> close</div>

  skills: {
    'mi-to-monday': "---\nname: \"mi-to-monday\"\ndescription: \"Turn an attached MI (media/material instructions) sheet into a Monday board or a new group on an existing board, with QA flags. Use for /mi-to-monday or any request to load an MI or specs sheet into Monday.\"\n---\n\n# MI sheet to Monday\n\nTurns an Excel or CSV MI sheet from a creative agency or client team into a clean, structured Monday board (or a new group on an existing board), and flags problems in the sheet instead of silently copying them across.\n\n## How it is called\n\n`/mi-to-monday <target name> <optional context>`\n\nExamples:\n- `/mi-to-monday TMC OOH Dispatch Sep-Nov` (new board)\n- `/mi-to-monday November flights on TMC OOH Dispatch` (new group on an existing board)\n- `/mi-to-monday Carman's Summer Social, Meta and TikTok only, live dates are the Mondays`\n\nThe MI sheet should be attached to the message. If it isn't, ask for it once. If the user gives a SharePoint or OneDrive path instead and the Microsoft 365 connector is available, fetch it from there.\n\n## Step 1: Work out the target\n\nRead the arguments and decide the mode:\n\n- **New board:** the user says \"board\", or the name doesn't match an existing board. Search Monday (`search`, type BOARD) to make sure a board with that name doesn't already exist.\n- **New group on an existing board:** the user names a group and a board (\"X on Y\"), or the project instructions name the client's MI board. Search for the board. If more than one matches, or none, ask which one.\n- If the group name already exists on that board, stop and ask whether to add to it or use a new name. Never create duplicate items.\n\nFor a new board, also settle:\n- **Workspace:** use the one in the project instructions or context. Otherwise ask once (list the user's workspaces).\n- **Board kind:** default to `public` so the team can see it. If the user says the creative agency or client needs to work in it, use `share`. Use `private` only for tests.\n\n## Step 2: Read the whole sheet properly\n\nUse code (openpyxl for .xlsx) and read every sheet. MI sheets are built for people, not machines, so expect:\n- Banner rows (month names, campaign names, dates) above blocks of data. Treat each banner as a section and keep it; it usually becomes a group.\n- The header row repeated in each section. Detect headers by content, not position.\n- Merged cells, blank spacer rows, notes in random cells.\n- Formulas, eg a material deadline of `=J10-7`. If the cached value is empty, calculate it yourself from the formula.\n- Cells copied from elsewhere with stray quote marks, tabs or line breaks. Clean the formatting (trim, collapse whitespace, strip wrapping quotes) but never change the meaning.\n\nThen decide the MI type:\n- **OOH / offline:** columns like network, format, panel ID, location, pixels, orientation, start, end, material deadline, file name.\n- **Digital ads:** columns like ad name, platform, primary text / body copy, headline, description, CTA, landing page URL, creative link, live date, ad format.\n- **Something else:** map it as sensibly as you can and say so in the plan.\n\n## Step 3: QA the sheet\n\nCheck every row and record issues per row. Do not fix data silently; write the issue into the QA column and tell the user.\n\nAll MIs:\n- Exact duplicate rows (import one, note the duplicate on it)\n- Required fields missing (dates, IDs, names, specs, URLs)\n- End date before start date; deadlines already passed with nothing marked as dispatched\n- Flight or run lengths that differ from the rest of the sheet\n- Obvious typos in place names or labels\n\nOOH:\n- Orientation that doesn't match the pixel size (wider than tall is landscape)\n- File name referring to a different panel ID than the row\n- Spec missing or \"see spec sheet\" with no spec sheet supplied\n\nDigital:\n- Copy over platform limits. Use limits given in the sheet's own headers first. Otherwise, for Meta flag primary text over 125, headline over 40 and description over 25 characters as \"may truncate\".\n- Landing page that isn't a valid URL, or is missing\n- CTA not in the platform's allowed list\n- Creative link missing\n\n## Step 4: Show the plan and wait for a yes\n\nBefore writing anything to Monday, show the user a short plan:\n- Mode, target board and group names, workspace and board kind\n- How many items per group, and how items will be named\n- Columns to be created (new board) or how sheet fields map to existing columns (existing board)\n- Number of rows with QA issues, with the top three examples\n- Rows that will be skipped and why\n\nWait for confirmation. If the user is not there to answer (scheduled run), stop after the plan.\n\n## Step 5: Build it\n\n### Columns for a new board\n\nOOH:\n| Column | Type |\n|---|---|\n| Dispatch Status | status: Awaiting Creative, Creative Received, Approved - Can Dispatch, Dispatched (done), Changes Required, Confirm Dispatched |\n| Network | status (one label per network in the sheet) |\n| Format, Panel ID, Location, Spec, File Name, Sheet Notes | text |\n| Orientation | status: Landscape, Portrait, Check |\n| Flight | timeline |\n| Material Deadline | date |\n| Creative | file |\n| Preview Link | link |\n| Media Instructions | long text |\n| Claude QA Flags | long text |\n| Import Key | text |\n\nDigital:\n| Column | Type |\n|---|---|\n| Status | status: Ready to Build, In Progress, Built - Pending Approval, Changes Required, Approved - Can Go Live, Live, Paused, Awaiting More Info |\n| Platform, Funnel, Ad Format, CTA | dropdown or status, labels from the sheet |\n| Live Date | date |\n| Focus, Headline, Description | text |\n| Primary Text | long text |\n| Landing Page URL, Creative Link, Preview Link | link |\n| Creative | file |\n| Creative Feedback, Notes | long text |\n| Claude QA Flags | long text |\n| Import Key | text |\n\nLeave out columns the sheet has no data for, unless they are part of the workflow (Status, Creative, Preview Link, QA Flags, Import Key).\n\n### Columns for an existing board\n\nUse the board's existing columns (`get_board_info` with columns only). Map each sheet field to the closest column. If a field has nowhere to go, or there is no QA column, ask before adding columns to someone else's board. Use the board's existing status labels; never invent new ones on a shared board without asking.\n\n### Groups and items\n\n- Groups: one per section in the sheet (eg month blocks for OOH, platform or funnel stage for digital), in sheet order.\n- Item names: OOH `<Panel ID> | <Location> | <start, eg 21 Sep>`; digital: the ad name from the sheet.\n- Import Key: `<main ID>|<start date>|row <sheet row>`, so a later import can match items instead of duplicating them.\n- Status: set from what the sheet tells you (eg file supplied means Creative Received; deadline passed with nothing dispatched means Confirm Dispatched). Don't guess beyond that.\n\n### Monday API notes (learned the hard way)\n\n- Create columns one at a time, in order, so the board reads left to right as planned.\n- Status column settings: each label's `id` must equal its `color` value, and both must be integers from Monday's colour list (eg `{\"labels\":[{\"id\":0,\"label\":\"Awaiting Creative\",\"color\":0,\"index\":0},{\"id\":1,\"label\":\"Dispatched\",\"color\":1,\"index\":1,\"is_done\":true}]}`). Colour names fail.\n- A new board comes with one default group (\"Group Title\", id `topics`). Rename it to the first section name with `all_api_write`: `mutation { update_group(board_id: <id>, group_id: \"topics\", group_attribute: title, new_value: \"<name>\") { id } }`. Deleting it may fail on permissions.\n- `create_items` takes at most 20 items per call. Always set `groupId`, or items land in the top group.\n- `columnValues` is a JSON object serialised once as a string. Formats: text `\"value\"`, long text `{\"text\": \"...\"}`, status `{\"label\": \"...\"}`, date `{\"date\": \"YYYY-MM-DD\"}`, timeline `{\"from\": \"YYYY-MM-DD\", \"to\": \"YYYY-MM-DD\"}`, link `{\"url\": \"...\", \"text\": \"...\"}`.\n- Leave a value out rather than sending an empty string for links and dates.\n\n## Step 6: Check, then report\n\nRead the board back (`get_board_items_page`) and confirm the item count per group matches the plan and that dates and statuses landed. Fix anything that didn't.\n\nThen report briefly:\n- Link to the board\n- Items created per group, and rows skipped and why\n- QA issues grouped by type with counts, naming the rows that need a human\n- One suggested next step (eg \"ask the creative agency to fix orientation on 7 rows\")\n\nUse Australian English. Don't send anything to the client or creative agency unless asked.",
    'wip-wrapup': "---\nname: \"wip-wrapup\"\ndescription: \"Wrap up a client WIP from its Granola notes - save structured notes to the client's SharePoint folder, update the Monday WIP board, draft the client email and draft the internal Slack recap. Use for /wip-wrapup.\"\n---\n\n# WIP wrap-up\n\nTurns one client WIP meeting in Granola into four outputs:\n1. Structured WIP notes saved to the client's SharePoint folder\n2. An updated Monday WIP board\n3. A client follow-up email, drafted in Outlook (never sent)\n4. An internal recap, drafted in Slack (never sent)\n\n## How it is called\n\n`/wip-wrapup <client> <optional: which meeting> <optional context>`\n\nExamples:\n- `/wip-wrapup TMC`\n- `/wip-wrapup Carman's yesterday's WIP, Kristy is on leave so send to Jess`\n- `/wip-wrapup TMC WIP 5 Oct, don't mention USA in the client email`\n\nAnything after the client name is extra instruction for this run and overrides the defaults below.\n\n## Step 1: Gather\n\n### The meeting\n- Find the meeting in Granola (`list_meetings`, then `get_meetings`). Default to the most recent meeting with the client's name in the title. If there are several candidates from the last week, or none, ask which one.\n- Use the meeting notes as the source of truth. They are often edited by a person after the meeting, so they win over the transcript or Granola's AI summary when they disagree. Use the transcript only to fill gaps.\n- Ignore Granola system text (eg \"No usable content captured\").\n\n### The client setup\nLook in the project instructions and project context first. They should name:\n- The client's SharePoint folder (eg `Client > General > TMC`)\n- The Monday WIP board\n- The internal Slack channel\n- Client contacts and their email addresses\n\nIf anything is missing, find it: `sharepoint_folder_search` for the client folder, Monday `search` (type BOARD) for \"<client> WIP\", `slack_search_channels` (public and private) for the client's internal channel. Confirm anything you had to find this way in the Step 3 checkpoint.\n\n### The last WIP\nIf the client's WIP Notes folder exists, read the most recent previous notes file. Use it to work out what changed since last time and which actions are still open.\n\n## Step 2: Extract\n\nPull out the following, keeping the meeting's own wording for names, dates and numbers:\n\n- **Attendees**, split into client and Half Dome\n- **Decisions.** Record conditional agreement as conditional (eg \"agreed in principle, pending numbers\" is not approval).\n- **Actions:** what, owner, client or Half Dome, due date. Where no owner or date was stated, write \"No owner agreed\" or \"No date set\". Never assign someone yourself.\n- **Changes since last WIP:** moved dates (old date and new date), changed scope, cancelled items\n- **Open questions**\n- **Internal only:** anything said after the client left, or flagged as not for the client. Treat it as internal for every output, even if only part of a topic was flagged.\n- **Next WIP:** date, time, place\n\nResolve relative dates (\"Wednesday\", \"next WIP\") to real dates using the meeting date.\n\n## Step 3: Checkpoint (only when needed)\n\nAsk for confirmation once, in a single message, and only if one of these applies:\n\n**a) The WIP Notes folder doesn't exist yet** (first run for this client). Show the full path where it will be created, eg `Client > General > TMC > WIP Notes`, with the parent folder's web link, and ask the user to confirm it's the right client folder. Do not create the folder until they say yes.\n\n**b) Existing Monday items would change.** Show a table of proposed changes:\n\n| Item | Field | Now | Proposed | Why (from the WIP) |\n|---|---|---|---|---|\n\nInclude status changes, date changes, owner changes, moving items to a Completed group, and notes being edited. The user can approve all, approve some, or edit them.\n\n**c) Something from Step 1 had to be guessed** (which meeting, which board, which channel).\n\nCreating new Monday items, saving a new notes file into an existing folder and creating drafts don't need approval. If nothing above applies, skip the checkpoint and run straight through.\n\nIf the user isn't there to answer (eg a scheduled run): do everything that doesn't need approval, list the pending folder creation and item changes in the final report, and leave them undone.\n\n## Step 4: Save the notes to SharePoint\n\n- Folder: `<client folder> / WIP Notes`. Create it with `sharepoint_create_folder` (driveId and parentItemId from the client folder search result) only after confirmation.\n- File name: `YYYY-MM-DD <Client> WIP.md`, using the meeting date, so files sort by date.\n- Write the notes as markdown, using exactly this structure every time so files stay consistent and easy to search:\n\n```markdown\n# <Client> WIP, <Day D Month YYYY>\n\n**Attendees (client):** <names>\n**Attendees (Half Dome):** <names>\n**Source:** <Granola note link>\n\n## Summary\n<three lines at most>\n\n## Decisions\n- <decision, marked \"conditional\" where it is>\n\n## Actions\n| Action | Owner | Client or HD | Due | Status |\n|---|---|---|---|---|\n| <what> | <name or \"No owner agreed\"> | <Client/HD> | <D Mon or \"No date set\"> | <New / Updated / Carried over> |\n\n## Changes since last WIP\n- <what changed, with old and new dates>\n\n## Open questions and actions with no owner\n- <item>\n\n## Internal only (Half Dome)\n- <item, or \"None\">\n\n## Next WIP\n<day, date, time, place>\n```\n\n- Upload with `sharepoint_upload_file`, passing the markdown as plain text in `content` (not `contentBase64`).\n- If a file with that name already exists, don't overwrite it. Ask whether to replace it or save as a new version.\n\n## Step 5: Update the Monday WIP board\n\n- Read the board first (`get_board_info` with columns only, then `get_board_items_page` with columns) so you know its groups, columns, status labels and current items.\n- Match each action to existing items by meaning, not exact wording. Classify each one as **new**, **update to an existing item**, or **no change**.\n- **New items:** create them without asking (`create_items`, up to 20 per call, always set `groupId`). Put them in the group that fits the topic. Use the board's existing status labels and columns; never add columns or labels without asking. Fill owner, client or Half Dome, due date and a short note saying which WIP raised it. If the board has a people column, only use it for Half Dome staff; client names go in a text or notes column. Leave the owner blank where none was agreed and say so in the note.\n- **Existing items:** change them only as approved in Step 3. When you apply a change, add a Monday update (comment) on the item with `create_update`, eg \"5 Oct WIP: due date moved from 20 Oct to 23 Oct at TMC's request\", so the history is kept rather than overwritten.\n- **Internal-only actions:** add them to the board only if it has an internal group or is clearly internal (board kind isn't `share`). Otherwise keep them to the notes file and Slack.\n- Read the board back afterwards to check the counts and dates landed.\n\n## Step 6: Draft the client email in Outlook\n\nCreate a draft with `outlook_create_draft` (HTML body). Never send it.\n\n- **To:** client attendees, using emails from Granola or the project context. **CC:** Half Dome attendees. If no client emails are known, leave To empty and say so.\n- **Subject:** `<Client> x Half Dome WIP recap, <Day D Mon>`\n- **Body,** in this order:\n  - One-line thanks and purpose\n  - Decisions\n  - What we're doing (Half Dome actions and dates)\n  - What we need from you (client actions and dates, written as requests)\n  - Changes to dates or plans, stated plainly with old and new dates\n  - Next WIP details\n- **Never include** internal-only items, internal commentary, performance concerns not raised with the client, fees or margins, or tasks with no owner unless they might belong to the client (then ask: \"Can you confirm who on your side will...?\").\n- Write conditional decisions as conditional.\n- Australian English, warm and concise. Sign off with the name of the person running the skill unless the project context says otherwise.\n\n## Step 7: Draft the internal recap in Slack\n\nCreate a draft with `slack_send_message_draft` in the client's internal channel. Never send it.\n\n- Short and scannable:\n  - Half Dome actions, with owners tagged where you can find their Slack user (`slack_search_users`, then `<@USERID>`)\n  - **Needs an owner today**\n  - Waiting on the client\n  - Internal only\n  - Links to the notes file, the Monday board and a line saying the client email is in Outlook drafts\n- If Slack returns `draft_already_exists`, tell the user to clear the existing draft in that channel, and give them the message text in the reply instead.\n- If the user isn't a member of the channel, say so and offer to draft it to their own DMs instead.\n\n## Step 8: Report\n\nFinish with a short summary:\n- Links: notes file, Monday board, Outlook draft, Slack channel\n- Monday: items created, items changed, changes still awaiting approval\n- Anything that needs a human: actions with no owner, questions for the client, steps that couldn't run\n\nDon't repeat the full content of the drafts in the reply."
