<script>
/* =====================================================================
   GAME CODE (no need to edit below to change text)
   ===================================================================== */
(() => {
'use strict';

const TILE = 40, VW = 1280, VH = 720, STEP = 1 / 120;
const GRAV = 2500, JUMP_V = 900, RUN = 320, MAXFALL = 1100;
const C = { gold: '#D2C663', red: '#8E1C02', purple: '#B0A3D0', ink: '#1A1917', card: '#F7F6F5', line: '#DEDBD6' };
const $ = (s, el = document) => el.querySelector(s);
const W_BY_ID = id => CONTENT.worlds.find(w => w.id === id);

/* ---------------- storage (per laptop) ---------------- */
const SAVE_KEY = 'summit-half-dome-v1';
const save = (() => {
  const d = { items: [], read: [], quiz: [], done: [], camps: [], checks: [], posts: [], sfxOn: true, musicOn: true, egg: false, presenter: false, summit: false };
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) Object.assign(d, JSON.parse(raw)); } catch (e) {}
  for (const k of ['items', 'read', 'quiz', 'done', 'camps', 'checks', 'posts']) if (!Array.isArray(d[k])) d[k] = [];
  return d;
})();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
function mark(list, v) { if (!save[list].includes(v)) { save[list].push(v); persist(); } }
function toggleIn(list, v) { const i = save[list].indexOf(v); if (i >= 0) save[list].splice(i, 1); else save[list].push(v); persist(); return i < 0; }
if (/presenter/.test(location.hash)) { save.presenter = true; persist(); }

/* ---------------- helpers ---------------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const plain = s => String(s).replace(/`([^`]+)`/g, '$1').replace(/\*\*([^*]+)\*\*/g, '$1');
const promptHTML = s => esc(s).replace(/\[([^\]]+)\]/g, '<span class="ph">[$1]</span>');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const hash = (x, y) => { let h = x * 374761393 + y * 668265263; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const allItems = () => CONTENT.worlds.flatMap(w => w.items.map(it => ({ ...it, world: w.id })));
const itemById = id => allItems().find(i => i.id === id);
const sectionTitle = (w, id) => ((w.sections || []).find(s => s.id === id) || {}).title || id || '';
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
const later = (list, fn, ms) => list.push(setTimeout(fn, ms));

/* ---------------- copy + downloads ---------------- */
async function copyText(t) {
  try { if (navigator.clipboard) { await navigator.clipboard.writeText(t); return true; } } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }

/* ---------------- level parsing ---------------- */
const T_EMPTY = 0, T_SOLID = 1, T_PLANK = 2, T_WATER = 3, T_MARK = 4, T_HIDDEN = 5;
let L = null;
function parseLevel(world) {

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = rows[y][x] || ' ';
    const set = t => grid[y * W + x] = t;
    switch (ch) {
      case '#': set(T_SOLID); break;
      case '=': set(T_PLANK); break;
      case '~': set(T_WATER); break;
      case '?': { set(T_MARK); const m = { x, y, bump: 0, kind: 'card' }; lv.markers.push(m); lv.cellMark.set(y * W + x, m); break; }
      case '!': { set(T_HIDDEN); const m = { x, y, bump: 0, kind: 'egg', revealed: false }; lv.hidden.push(m); lv.cellMark.set(y * W + x, m); break; }
      case 'b': lv.items.push({ x, y, t: hash(x, y) * 6 }); break;
      case 'P': lv.start = { x, y }; break;
      case 'S': lv.signs.push({ x, y, text: world.stage, kind: 'post' }); break;
      case 'T': lv.pines.push({ x, y, h: 120 + hash(x, y) * 70 }); break;
      case 'R': lv.ranger = { x, y, flag: 0, raised: false }; break;
      case 'C': lv.camps.push({ x, y }); break;
      case 'X': lv.exit = { x, y }; break;
      case 'K': lv.posts.push({ x, y, glow: 0 }); break;
      case 'Y': lv.beacon = { x, y }; break;
      case 'I': lv.cables.push({ x, y }); break;
      case 'Z': lv.summit = { x, y }; break;
      default:
        if (/[1-9]/.test(ch)) {
          const sg = (world.signs || {})[ch]; const def = typeof sg === 'string' ? { text: sg } : (sg || { text: '' });
          lv.signs.push({ x, y, text: def.text, kind: def.carve ? 'carve' : 'post' });
          if (def.carve) set(T_SOLID);
        }
    }
  }
  // cards, items, campfires and posts are numbered left to right, whatever row they sit on
  const byX = (a, b) => a.x - b.x || a.y - b.y;
  lv.markers.sort(byX).forEach((m, i) => m.idx = i);
  lv.items.sort(byX).forEach((m, i) => m.idx = i);
  lv.camps.sort(byX).forEach((m, i) => m.idx = i);
  lv.posts.sort(byX).forEach((m, i) => m.idx = i);
  lv.cables.sort(byX);
  return lv;
}
const tileAt = (x, y) => {

/* ---------------- loop ---------------- */
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;

}

function potential() {
  let sum = 0;

    if (save.done.includes(w.id)) { sum += 1; continue; }
    const read = w.cards.filter((_, i) => save.read.includes(`${w.id}-${i}`)).length;
    sum += 0.85 * read / w.cards.length;

}

      ${dests.map(([n, s, c], i) => `<div class="dest" style="top:${14 + i * 54}px">${n}<span class="sp ${c}">${s}</span></div>`).join('')}
      ${dests.map((_, i) => `<span class="pkt" data-i="${i}" style="top:110px"></span>`).join('')}<span class="pkt int" style="top:150px"></span>

    pk.forEach((p, i) => later(timers, () => { move(p, 250, 14 + i * 54 + 13 - 110, 700); later(timers, () => { ds[i].classList.add('on'); p.style.visibility = 'hidden'; }, 700); }, 300 + i * 350));

      later(timers, () => { $('.bounce', host).style.opacity = 1; ds[2].style.borderColor = '#8E1C02'; }, 600);

    host.innerHTML = rows.map(([a, b, st], i) => `<div class="tr" style="animation-delay:${0.2 + i * 0.45}s"><div class="in">${a}</div><div class="ar">→</div><div class="out" style="${st}">${b}</div></div>`).join('');
  },
  chrome(host) {
    host.classList.add('v-win');
    host.innerHTML = `<div class="w"><div class="tb"><i></i><i></i><i></i><span class="url">client-portal · signed in as you</span></div>
      <div class="body"><div class="tile">Spend this month <span class="spark"></span></div><div class="tile">Top placements <span class="spark"></span></div><div class="tile">Pacing <span class="spark"></span></div></div>
      <div class="pane"><div class="lbl">Claude in the browser</div><div class="msg u" style="animation-delay:.3s">Pull this month's spend by placement into a table</div><div class="msg c" style="animation-delay:1.4s">Done. 12 placements, using the portal you're logged into. No connector needed.</div></div>

  excel(host) {

    $('del', host).style.opacity = 1; $('del', host).style.textDecoration = 'none'; $('del', host).style.color = 'inherit';

/* ---------------- keyboard ---------------- */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (isListOpen()) {
    const typing = e.target.closest('input,textarea');
    if (k === '/' && !typing) { e.preventDefault(); const q = $('#lvq', list); if (q) q.focus(); return; }
    if (!typing && (k === 'escape' || k === 'l')) { e.preventDefault(); toggleList(false); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (current) {
    if (e.repeat) return;
    if (k === 'escape') { e.preventDefault(); userClose(); return; }
    if (k === 'enter' && current.enterCloses && !e.target.closest('button,a,[role="button"]')) { e.preventDefault(); userClose(); return; }
    if (k === 'enter' && current.kind === 'quiz' && current.raiseReady && current.raiseReady()) { e.preventDefault(); closeOverlay(); return; }
    if (current.kind === 'quiz' && /^[1-4]$/.test(k)) { current.pick(+k - 1); return; }
    if (k === 'm') { e.preventDefault(); current.kind === 'map' ? closeOverlay() : openMap(); return; }
    if (k === 'b') { e.preventDefault(); current.kind === 'pack' ? closeOverlay() : openBackpack(); return; }
    if (k === 'l') { e.preventDefault(); openList(); return; }
    if (k === 'p') { togglePresenter(); return; }
    if (k === ' ' && current.kind !== 'title' && !e.target.closest('button')) e.preventDefault();
    if (k.startsWith('arrow') && current.kind !== 'pack' && current.kind !== 'camp' && current.kind !== 'finale') e.preventDefault();
    return;
  }
  switch (k) {
    case 'arrowleft': case 'a': keys.left = true; break;
    case 'arrowright': case 'd': keys.right = true; break;
    case ' ': case 'arrowup': case 'w': case 'z': if (!e.repeat) jumpQueued = true; keys.jump = true; break;
    case 'e': case 'enter': if (!e.repeat) actQueued = true; break;
    case 'm': openMap(); break;
    case 'b': openBackpack(); break;
    case 'l': openList(); break;
    case 'p': togglePresenter(); break;
    default: return;
  }
  e.preventDefault();
  hideHelpSoon();
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') keys.left = false;
  if (k === 'arrowright' || k === 'd') keys.right = false;
  if (k === ' ' || k === 'arrowup' || k === 'w' || k === 'z') keys.jump = false;
});
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; });
let helpT = 0;
function hideHelpSoon() { if (helpT) return; helpT = setTimeout(() => { $('#help').style.opacity = '0'; }, 9000); }
function togglePresenter() { save.presenter = !save.presenter; persist(); updateHud(); toast(save.presenter ? 'Presenter mode on: talk tracks show on cards' : 'Presenter mode off'); }

/* touch */
const touchEl = $('#touch');
if (matchMedia('(pointer: coarse)').matches) touchEl.classList.add('on');
touchEl.querySelectorAll('.tbtn').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); b.classList.add('down'); if (k === 'left') keys.left = true; if (k === 'right') keys.right = true; if (k === 'jump') { keys.jump = true; jumpQueued = true; } if (k === 'act') actQueued = true; };
  const up = e => { e.preventDefault(); b.classList.remove('down'); if (k === 'left') keys.left = false; if (k === 'right') keys.right = false; if (k === 'jump') keys.jump = false; };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
});

/* HUD buttons */
$('#hudLogo').src = ASSETS.logo;
$('#btnMap').addEventListener('click', e => { e.currentTarget.blur(); current && current.kind === 'map' ? closeOverlay() : openMap(); });
$('#btnPack').addEventListener('click', e => { e.currentTarget.blur(); current && current.kind === 'pack' ? closeOverlay() : openBackpack(); });
$('#btnList').addEventListener('click', e => { e.currentTarget.blur(); openList(); });
$('#btnSound').addEventListener('click', e => { e.currentTarget.blur(); save.sfxOn = !save.sfxOn; persist(); updateHud(); if (save.sfxOn) sfx.tick(); });
$('#btnMusic').addEventListener('click', e => { e.currentTarget.blur(); save.musicOn = !save.musicOn; persist(); updateHud(); setMusic(save.musicOn); });
$('#btnPresenter').addEventListener('click', e => { e.currentTarget.blur(); togglePresenter(); });

/* ---------------- routing + boot ---------------- */
function worldFromHash() { const m = location.hash.match(/world-(\d)/); return m ? +m[1] : 0; }
addEventListener('hashchange', () => {
  const id = worldFromHash();
  if (/presenter/.test(location.hash) && !save.presenter) togglePresenter();
  if (id && (!L || L.world.id !== id)) { closeOverlay(true); if (isListOpen()) toggleList(false); loadWorld(id); }
});
function boot() {
  const id = worldFromHash();
  if (id && W_BY_ID(id)) loadWorld(id);
  else { loadWorld(1); started = false; openTitle(); }
  updateHud();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}
// a small hook for automated checks
window.__summit = { P, get L() { return L; }, save, loadWorld, keys, get current() { return current; }, makeZip, kitMarkdown, openCard: (w, i) => { loadWorld(w); openMarkerCard(i); }, openBasecamp: (w, i) => { loadWorld(w); openBasecamp(i); }, openBackpack, reachSummit: () => { loadWorld(6); reachSummit(); } };
boot();
})();
