<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Summit Half Dome</title>
<meta name="description" content="A Claude kickstart for Half Dome's Client Solutions team, played as the Half Dome hike.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#D2C663; --red:#8E1C02; --purple:#B0A3D0;
  --ink:#1A1917; --muted:#55524E; --card:#F7F6F5; --line:#DEDBD6;
  --gold-soft:#EEE8B8; --purple-soft:#E6E0F2; --red-soft:#F1DAD3;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--ink);font-family:var(--sans);overflow:hidden}
button{font-family:inherit;cursor:pointer}
code,.mono{font-family:var(--mono)}

/* ---------- stage (designed at 1280 x 720, letterboxed) ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;overflow:hidden;background:#cfe0ea;border-radius:2px}
#game{position:absolute;inset:0;width:1280px;height:720px;display:block}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px;pointer-events:none;z-index:5}
.hud-left{display:flex;flex-direction:column;gap:6px}
.wordmark{font-weight:900;font-size:26px;letter-spacing:-0.04em;color:var(--ink);line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.wordmark i{font-style:normal;color:var(--red)}
.worldtag{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:rgba(247,246,245,.92);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--ink);display:inline-flex;gap:8px;align-items:center;width:max-content}
.worldtag b{color:var(--red)}
.hud-right{display:flex;gap:8px;pointer-events:auto}
.hbtn{display:flex;align-items:center;gap:8px;background:rgba(247,246,245,.94);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--ink);box-shadow:0 2px 0 rgba(26,25,23,.08)}
.hbtn:hover{background:#fff;border-color:var(--gold)}
.hbtn kbd{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--ink);color:var(--card);border-radius:5px;padding:2px 6px}
.hbtn .count{font-family:var(--mono);font-size:12px;background:var(--gold);border-radius:999px;padding:1px 8px}
.progress{position:absolute;left:22px;bottom:18px;z-index:5;display:flex;gap:8px;pointer-events:none}
.chip{font-family:var(--mono);font-size:12px;font-weight:600;background:rgba(247,246,245,.92);border:1px solid var(--line);border-radius:999px;padding:6px 12px;display:flex;gap:8px;align-items:center}
.chip .dot{width:10px;height:10px;border-radius:3px;background:var(--gold);border:1px solid #9c9140}
.chip .dot.p{background:var(--purple);border-color:#7d6fa6;border-radius:50%}
.help{position:absolute;right:22px;bottom:18px;z-index:5;font-family:var(--mono);font-size:11.5px;color:var(--ink);background:rgba(247,246,245,.85);border:1px solid var(--line);border-radius:10px;padding:7px 11px;pointer-events:none;transition:opacity .6s}
.help kbd{font-family:var(--mono);background:var(--ink);color:var(--card);border-radius:4px;padding:1px 5px;font-size:10.5px}

.toast{position:absolute;left:50%;top:76px;transform:translate(-50%,-12px);background:var(--ink);color:var(--card);font-weight:700;font-size:15px;padding:10px 16px;border-radius:12px;opacity:0;transition:all .25s;z-index:30;pointer-events:none;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:10px;height:10px;border-radius:50%;background:var(--gold);display:inline-block}

/* ---------- touch controls ---------- */
.touch{position:absolute;inset:auto 0 0 0;height:150px;z-index:6;display:none;pointer-events:none}
.touch.on{display:block}
.tbtn{position:absolute;bottom:26px;width:96px;height:96px;border-radius:50%;background:rgba(247,246,245,.55);border:2px solid rgba(26,25,23,.25);font:800 30px var(--sans);color:var(--ink);pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.tbtn:active,.tbtn.down{background:var(--gold)}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(26,25,23,.42);opacity:0;transition:opacity .18s}
.overlay.show{opacity:1}
.panel{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px rgba(26,25,23,.35),0 2px 0 rgba(26,25,23,.06);transform:translateY(14px) scale(.98);transition:transform .22s cubic-bezier(.2,1.4,.4,1)}
.overlay.show .panel{transform:none}
.panel:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;border-radius:20px 20px 0 0;background:var(--gold)}
.panel.red:before{background:var(--red)}
.panel.purple:before{background:var(--purple)}
.eyebrow{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
.eyebrow .tag{background:var(--ink);color:var(--card);border-radius:6px;padding:3px 8px;letter-spacing:.04em}
.eyebrow .tag.gold{background:var(--gold);color:var(--ink)}
.eyebrow .tag.purple{background:var(--purple);color:var(--ink)}
.eyebrow .tag.red{background:var(--red);color:#fff}
.closehint{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.closehint kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px;color:var(--ink)}

/* card */
.card{width:820px;max-height:640px;padding:34px 40px 26px;display:flex;flex-direction:column;gap:14px;cursor:pointer}
.card h2{margin:0;font-size:36px;line-height:1.08;font-weight:800;letter-spacing:-0.02em}
.card .lines{display:flex;flex-direction:column;gap:6px}
.card .lines p{margin:0;font-size:20px;line-height:1.42;color:#33312e}
.card .lines code,.list code{font-family:var(--mono);font-size:.88em;background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.card .tagline{align-self:flex-start;font-family:var(--mono);font-size:13px;font-weight:600;background:var(--gold-soft);border:1px solid var(--gold);border-radius:999px;padding:4px 12px}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.talk{font-size:15px;border:1.5px dashed var(--purple);background:var(--purple-soft);border-radius:10px;padding:8px 12px;color:var(--ink)}
.talk b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.visual{position:relative;height:236px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.replay{position:absolute;right:10px;bottom:10px;z-index:3;font-family:var(--mono);font-size:11px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.replay:hover{border-color:var(--gold);color:var(--ink)}

/* item card */
.item{width:820px;padding:34px 40px 26px;display:flex;flex-direction:column;gap:14px}
.item h2{margin:0;font-size:34px;font-weight:800;letter-spacing:-0.02em}
.item .sub{margin:0;font-size:17px;color:var(--muted)}
.prompt{position:relative;margin:0;font-family:var(--mono);font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line);border-left:5px solid var(--purple);border-radius:12px;padding:16px 18px;max-height:300px;overflow:auto;cursor:text;user-select:text;-webkit-user-select:text}
.prompt .ph{background:var(--purple-soft);border-radius:4px;padding:0 3px;color:#4a3d78}
.btnrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:800;background:var(--ink);color:var(--card);display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:#000}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.gold:hover{background:#c4b84f}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.small{padding:8px 12px;font-size:13.5px;border-radius:10px}
.copied{font-family:var(--mono);font-size:13px;color:#4f6f2f;font-weight:600}
.note{font-family:var(--mono);font-size:13px;background:var(--gold-soft);border-radius:8px;padding:4px 10px}

/* quiz */
.quiz{width:820px;padding:34px 40px 28px;display:flex;flex-direction:column;gap:16px}
.quiz h2{margin:0;font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-0.01em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font-size:17px;font-weight:600;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);min-height:68px;transition:transform .12s,border-color .12s}
.opt:hover{border-color:var(--ink);transform:translateY(-1px)}
.opt kbd{flex:none;font-family:var(--mono);font-size:12px;width:26px;height:26px;display:grid;place-items:center;border-radius:7px;background:var(--card);border:1px solid var(--line)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);animation:shake .35s}
.opt.right{border-color:#9c9140;background:var(--gold);}
.opt[disabled]{cursor:default}
.why{font-size:17px;line-height:1.45;border-radius:12px;padding:12px 16px;display:none}
.why.show{display:block}
.why.bad{background:var(--red-soft);border:1px solid #d9a99a}
.why.good{background:var(--gold-soft);border:1px solid var(--gold)}
.why b{font-weight:800}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* basecamp */
.camp{width:760px;padding:36px 40px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;background:#1f1d1a;color:var(--card);border-color:#36332e}
.camp:before{background:var(--red)}
.camp .eyebrow{color:#b9b3a8}
.camp h2{margin:0;font-size:40px;line-height:1.08;font-weight:900;letter-spacing:-0.02em}
.camp h2 em{font-style:normal;color:var(--gold)}
.camp p{margin:0;font-size:22px;color:#e9e5dc}
.fire{position:relative;width:140px;height:120px;margin:4px 0}
.fire .glow{position:absolute;left:50%;bottom:4px;width:200px;height:120px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(210,198,99,.45),transparent);animation:glow 1.4s ease-in-out infinite alternate}
.fire .log{position:absolute;bottom:8px;left:50%;width:110px;height:16px;background:#6b4a2c;border-radius:8px}
.fire .log.a{transform:translateX(-50%) rotate(14deg)}
.fire .log.b{transform:translateX(-50%) rotate(-14deg)}
.fire .fl{position:absolute;bottom:18px;left:50%;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform-origin:bottom center}
.fire .f1{width:60px;height:86px;margin-left:-30px;background:var(--red);animation:flick 0.9s ease-in-out infinite alternate}
.fire .f2{width:42px;height:66px;margin-left:-21px;background:#d9762a;animation:flick 0.7s ease-in-out infinite alternate-reverse}
.fire .f3{width:24px;height:42px;margin-left:-12px;background:var(--gold);animation:flick 0.55s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) skewX(-3deg)}100%{transform:scale(.9,1.12) skewX(4deg)}}
@keyframes glow{to{opacity:.6;transform:translateX(-50%) scale(1.08)}}
.camp .btn{margin-top:8px}

/* complete */
.done{width:700px;padding:36px 40px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.done h2{margin:0;font-size:42px;font-weight:900;letter-spacing:-0.02em}
.done p{margin:0;font-size:19px;color:var(--muted)}
.stats{display:flex;gap:10px}

/* backpack */
.pack{width:900px;max-height:640px;padding:30px 36px 24px;display:flex;flex-direction:column;gap:14px}
.pack:before{background:var(--purple)}
.pack h2{margin:0;font-size:32px;font-weight:800}
.packlist{overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:6px}
.pitem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.pitem.locked{background:transparent;border-style:dashed;color:var(--muted);flex-direction:row;align-items:center;gap:12px}
.pitem .ph-lock{width:30px;height:30px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-family:var(--mono);font-weight:700}
.pitem h3{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pitem h3 small{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.pitem .prompt{font-size:13.5px;max-height:150px;padding:12px 14px}

/* title */
.title{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;padding:0 90px;background:linear-gradient(90deg,rgba(247,246,245,.96) 0,rgba(247,246,245,.88) 46%,rgba(247,246,245,0) 72%);opacity:0;transition:opacity .25s}
.title.show{opacity:1}
.title .kick{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.title h1{margin:10px 0 8px;font-size:92px;line-height:.92;font-weight:900;letter-spacing:-0.045em;max-width:640px}
.title h1 span{display:block;color:var(--red)}
.title p{font-size:21px;color:var(--muted);margin:6px 0 26px;max-width:520px;line-height:1.4}
.title .btnrow .btn{font-size:18px;padding:14px 22px}
.keys{margin-top:28px;font-family:var(--mono);font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto auto;gap:6px 18px;width:max-content}
.keys kbd{font-family:var(--mono);background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11.5px;color:var(--ink);margin-right:3px}

/* map */
.map{position:absolute;inset:0;z-index:20;opacity:0;transition:opacity .2s;background:var(--card)}
.map.show{opacity:1}
.map svg{position:absolute;inset:0;width:1280px;height:720px}
.map .mhead{position:absolute;left:40px;top:30px;display:flex;flex-direction:column;gap:6px}
.map .mhead h2{margin:0;font-size:40px;font-weight:900;letter-spacing:-0.02em}
.map .mhead p{margin:0;font-size:17px;color:var(--muted);max-width:520px}
.map .mclose{position:absolute;right:30px;top:28px;display:flex;gap:10px;align-items:center}
.node{cursor:pointer}
.node:hover .nring{stroke:var(--ink)}
.node:focus{outline:none}
.node:focus .nring{stroke:var(--ink);stroke-width:4}
.nlabel{font-family:var(--sans);font-size:15px;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:#F7F6F5;stroke-width:5px;stroke-linejoin:round}
.nsub{font-family:var(--mono);font-size:11.5px;font-weight:600;fill:var(--muted);letter-spacing:.04em;paint-order:stroke;stroke:#F7F6F5;stroke-width:4px;stroke-linejoin:round}
.pulse{animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}

/* ---------- list view (outside the stage, normal page) ---------- */
#list{position:fixed;inset:0;z-index:100;background:#fff;overflow:auto;display:none;color:var(--ink)}
#list.on{display:block}
.list{max-width:860px;margin:0 auto;padding:28px 22px 80px}
.lhead{position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);z-index:2}
.lhead .wordmark{font-size:24px;text-shadow:none}
.list h1{font-size:44px;font-weight:900;letter-spacing:-0.03em;margin:30px 0 4px;line-height:1}
.list .lede{color:var(--muted);font-size:18px;margin:0 0 10px}
.lnav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 10px}
.lnav a{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.lnav a:hover{border-color:var(--gold);background:var(--gold-soft)}
.list section{border-top:6px solid var(--gold);margin-top:38px;padding-top:16px}
.list section:nth-of-type(3n+2){border-top-color:var(--purple)}
.list section:nth-of-type(3n+3){border-top-color:var(--red)}
.list h2{font-size:30px;margin:4px 0 2px;letter-spacing:-0.02em}
.list .wsub{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.list h3{font-size:20px;margin:22px 0 6px}
.list h4{font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.07em;margin:26px 0 4px;color:var(--red)}
.list p,.list li{font-size:17px;line-height:1.5}
.list p{margin:4px 0}
.list .lcard{border-left:3px solid var(--line);padding-left:14px;margin:14px 0}
.list .lcard h3{margin:0 0 4px}
.list .ltag{display:inline-block;font-family:var(--mono);font-size:12.5px;background:var(--gold-soft);border-radius:999px;padding:2px 10px;margin-top:4px}
.list .litem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0}
.list .litem h3{margin:0 0 8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.list .prompt{font-size:14px;max-height:none}
.list details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
.list summary{cursor:pointer;font-weight:700}
.list .camp-l{background:#1f1d1a;color:var(--card);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:17px}
.list .camp-l b{color:var(--gold)}
.list ol,.list ul{padding-left:22px}

/* ---------- card visuals ---------- */
.vx{position:absolute;inset:0;font-family:var(--sans)}
.vx .lbl{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
/* prefs */
.v-prefs .win{position:absolute;left:24px;top:22px;width:430px;height:190px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.v-prefs .bar{height:30px;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line);background:#fff}
.v-prefs .bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.v-prefs .bar span{margin-left:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.v-prefs .ta{margin:12px;height:120px;background:#fff;border:1.5px solid var(--gold);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.5;color:var(--ink)}
.v-prefs .caret{display:inline-block;width:7px;height:15px;background:var(--ink);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.v-prefs .sw{position:absolute;left:38px;bottom:30px;display:flex;gap:8px}
.v-prefs .sw b{width:26px;height:26px;border-radius:7px;transform:scale(0);transition:transform .35s cubic-bezier(.2,1.6,.4,1);border:1px solid rgba(0,0,0,.12)}
.v-prefs .sw b.on{transform:scale(1)}
.v-prefs .reach{position:absolute;right:24px;top:22px;width:240px;height:190px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.v-prefs .pill{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:800;font-size:18px;color:#a9a49c;background:#fff;display:flex;justify-content:space-between;align-items:center;transition:all .35s}
.v-prefs .pill:after{content:"";width:12px;height:12px;border-radius:50%;background:var(--line);transition:all .35s}
.v-prefs .pill.on{border-color:#9c9140;background:var(--gold);color:var(--ink);transform:translateX(-6px)}
.v-prefs .pill.on:after{background:var(--red)}
/* about */
.v-about .pg{position:absolute;left:40px;top:22px;width:170px;height:192px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:6px;transform-origin:top left;animation:pgShrink 1.4s .5s ease-in-out forwards}

/* ---------------- level parsing ---------------- */
const T_EMPTY = 0, T_SOLID = 1, T_PLANK = 2, T_WATER = 3, T_MARK = 4, T_HIDDEN = 5;
let L = null; // current level
function parseLevel(world) {
  const rows = world.level, H = rows.length, W = Math.max(...rows.map(r => r.length));
  const grid = new Uint8Array(W * H);
  const lv = { world, W, H, grid, markers: [], hidden: [], items: [], signs: [], pines: [], camps: [], ranger: null, exit: null, start: { x: 2, y: H - 4 }, cellMark: new Map() };
  let mi = 0, ii = 0, ci = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = rows[y][x] || ' ';
    const set = t => grid[y * W + x] = t;
    switch (ch) {
      case '#': set(T_SOLID); break;
      case '=': set(T_PLANK); break;
      case '~': set(T_WATER); break;
      case '?': { set(T_MARK); const m = { x, y, idx: mi++, bump: 0, kind: 'card' }; lv.markers.push(m); lv.cellMark.set(y * W + x, m); break; }
      case '!': { set(T_HIDDEN); const m = { x, y, bump: 0, kind: 'egg', revealed: false }; lv.hidden.push(m); lv.cellMark.set(y * W + x, m); break; }
      case 'b': lv.items.push({ x, y, idx: ii++, t: Math.random() * 6 }); break;
      case 'P': lv.start = { x, y }; break;
      case 'S': lv.signs.push({ x, y, kind: 'start' }); break;
      case 'T': lv.pines.push({ x, y, h: 120 + hash(x, y) * 70 }); break;
      case 'R': lv.ranger = { x, y, flag: 0, raised: false }; break;
      case 'C': lv.camps.push({ x, y, idx: ci++ }); break;
      case 'X': lv.exit = { x, y }; break;
    }
  }
  // markers, items and basecamps are numbered left to right, whatever row they sit on
  const byX = (a, b) => a.x - b.x || a.y - b.y;
  lv.markers.sort(byX).forEach((m, i) => m.idx = i);
  lv.items.sort(byX).forEach((m, i) => m.idx = i);
  lv.camps.sort(byX).forEach((m, i) => m.idx = i);
  return lv;
}
const tileAt = (x, y) => {
  if (x < 0 || x >= L.W) return T_SOLID;
  if (y < 0 || y >= L.H) return T_EMPTY;
  return L.grid[y * L.W + x];
};
const isSolidTile = (x, y) => {
  const t = tileAt(x, y);
  if (t === T_SOLID || t === T_MARK) return true;
  if (t === T_HIDDEN) { const m = L.cellMark.get(y * L.W + x); return m && m.revealed; }
  return false;
};

/* ---------------- player ---------------- */
const P = { x: 0, y: 0, w: 24, h: 50, vx: 0, vy: 0, ground: false, coyote: 0, buffer: 0, face: 1, sx: 1, sy: 1, walk: 0, safe: { x: 0, y: 0 }, inv: 0 };
function placePlayer(tx, ty) {
  P.x = tx * TILE + (TILE - P.w) / 2; P.y = (ty + 1) * TILE - P.h;
  P.vx = P.vy = 0; P.ground = false; P.safe = { x: P.x, y: P.y };
}

/* ---------------- input ---------------- */
const keys = { left: false, right: false, jump: false };
let jumpQueued = false, actQueued = false;

/* ---------------- game state ---------------- */
let worldIdx = 0, cam = { x: 0, y: 0 }, shake = 0, time = 0, overlayOpen = false, started = false;
const parts = [];
let rangerZone = false, campZone = -1, exitZone = false, nearTarget = null;

function loadWorld(id, opts = {}) {
  const w = CONTENT.worlds.find(w => w.id === id);
  if (!w) return;
  if (!w.level) { toast(`World ${id} opens in the next build`); return false; }
  worldIdx = CONTENT.worlds.indexOf(w);
  L = parseLevel(w);
  L.hidden.forEach(h => { h.revealed = save.egg; });
  if (save.quiz.includes(w.id) && L.ranger) { L.ranger.raised = true; L.ranger.flag = 1; }
  placePlayer(L.start.x, L.start.y);
  cam.x = clamp(P.x - VW * 0.35, 0, L.W * TILE - VW);
  cam.y = clamp(L.H * TILE - VH, 0, 1e9);
  parts.length = 0; rangerZone = false; campZone = -1; exitZone = false;
  if (location.hash !== '#world-' + id) { try { history.replaceState(null, '', location.pathname + location.search + '#world-' + id); } catch (e) {} }
  updateHud();
  started = true;
  return true;
}

/* ---------------- physics ---------------- */
function update(dt) {
  time += dt;
  for (const m of L.markers) m.bump = Math.max(0, m.bump - dt * 6);
  for (const m of L.hidden) m.bump = Math.max(0, m.bump - dt * 6);
  if (L.ranger) { const r = L.ranger; r.flag = approach(r.flag, r.raised ? 1 : 0, dt * 0.9); }
  updateParticles(dt);
  shake = Math.max(0, shake - dt * 30);

  if (overlayOpen || !started) { P.sx = lerp(P.sx, 1, 0.2); P.sy = lerp(P.sy, 1, 0.2); return; }

  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dir) P.face = dir;
  const accel = P.ground ? 2600 : 1800;
  if (dir) P.vx = approach(P.vx, dir * RUN, accel * dt);
  else P.vx = approach(P.vx, 0, (P.ground ? 3200 : 900) * dt);

  if (jumpQueued) { P.buffer = 0.14; jumpQueued = false; }
  P.coyote = P.ground ? 0.1 : P.coyote - dt;
  if (P.buffer > 0 && P.coyote > 0) {
    P.vy = -JUMP_V; P.buffer = 0; P.coyote = 0; P.ground = false;
    P.sx = 0.72; P.sy = 1.32; dust(P.x + P.w / 2, P.y + P.h, 6); sfx.jump();
  }
  P.buffer -= dt;

  let g = GRAV;
  if (P.vy < 0 && !keys.jump) g *= 2.3;           // short hop when released
  if (Math.abs(P.vy) < 90 && !P.ground) g *= 0.7;  // floaty apex
  P.vy = Math.min(P.vy + g * dt, MAXFALL);

  // horizontal
  P.x += P.vx * dt;
  collideX();
  // vertical
  const prevBottom = P.y + P.h, prevTop = P.y;
  P.y += P.vy * dt;
  const wasGround = P.ground;
  P.ground = false;
  collideY(prevBottom, prevTop);
  if (P.ground && !wasGround) {
    const impact = clamp(lastFall / 900, 0, 1);
    P.sx = 1 + 0.35 * impact; P.sy = 1 - 0.3 * impact;
    if (impact > 0.35) { dust(P.x + P.w / 2, P.y + P.h, 4 + Math.round(impact * 6)); sfx.land(); }
  }
  lastFall = P.vy > 0 ? P.vy : lastFall;
  if (P.ground) {
    const cx = Math.floor((P.x + P.w / 2) / TILE), by = Math.floor((P.y + P.h + 2) / TILE);
    const l = tileAt(Math.floor((P.x + 2) / TILE), by), r = tileAt(Math.floor((P.x + P.w - 2) / TILE), by);
    if ((l === T_SOLID || l === T_PLANK) && (r === T_SOLID || r === T_PLANK) && tileAt(cx, by) !== T_WATER) P.safe = { x: P.x, y: P.y };
  }

  // water and falling out
  const fx = Math.floor((P.x + P.w / 2) / TILE), fy = Math.floor((P.y + P.h - 8) / TILE);
  if (tileAt(fx, fy) === T_WATER || P.y > L.H * TILE + 80) respawn();

  // walk anim + squash recovery
  P.walk += Math.abs(P.vx) * dt * 0.05;
  P.sx = lerp(P.sx, 1, 0.16); P.sy = lerp(P.sy, 1, 0.16);
  if (P.ground && Math.abs(P.vx) > 200 && Math.random() < 0.06) dust(P.x + P.w / 2 - P.face * 10, P.y + P.h, 1);

  interact();
  // camera
  const look = P.face * 90 + P.vx * 0.15;
  const tx = clamp(P.x + P.w / 2 - VW * 0.42 + look, 0, Math.max(0, L.W * TILE - VW));
  cam.x = lerp(cam.x, tx, 1 - Math.pow(0.0006, dt));
  const ty = clamp(P.y - VH * 0.55, 0, Math.max(0, L.H * TILE - VH));
  cam.y = lerp(cam.y, ty, 1 - Math.pow(0.002, dt));
}
let lastFall = 0;

function collideX() {
  const top = Math.floor(P.y / TILE), bot = Math.floor((P.y + P.h - 1) / TILE);
  if (P.vx > 0) {
    const tx = Math.floor((P.x + P.w) / TILE);
    for (let y = top; y <= bot; y++) if (isSolidTile(tx, y)) { P.x = tx * TILE - P.w; P.vx = 0; break; }
  } else if (P.vx < 0) {
    const tx = Math.floor(P.x / TILE);
    for (let y = top; y <= bot; y++) if (isSolidTile(tx, y)) { P.x = (tx + 1) * TILE; P.vx = 0; break; }
  }
  P.x = clamp(P.x, 0, L.W * TILE - P.w);
}
function collideY(prevBottom, prevTop) {
  const l = Math.floor((P.x + 1) / TILE), r = Math.floor((P.x + P.w - 1) / TILE);
  if (P.vy >= 0) {
    const ty = Math.floor((P.y + P.h) / TILE);
    for (let x = l; x <= r; x++) {
      const t = tileAt(x, ty);
      const solid = isSolidTile(x, ty) || (t === T_PLANK && prevBottom <= ty * TILE + 1);
      if (solid) { P.y = ty * TILE - P.h; P.vy = 0; P.ground = true; return; }
    }
  } else {
    const ty = Math.floor(P.y / TILE);
    // prefer the tile under the player's centre when bumping
    const cx = Math.floor((P.x + P.w / 2) / TILE);
    const order = [cx, l, r].filter((v, i, a) => a.indexOf(v) === i);
    for (const x of order) {
      const t = tileAt(x, ty);
      const hiddenHit = t === T_HIDDEN && prevTop >= (ty + 1) * TILE - 1;
      if (isSolidTile(x, ty) || hiddenHit) {
        P.y = (ty + 1) * TILE; P.vy = 40;
        const m = L.cellMark.get(ty * L.W + x);
        if (m) hitMarker(m); else { sfx.bump(); }
        return;
      }
    }
  }
}
function respawn() {
  splash(P.x + P.w / 2, P.y + P.h);
  sfx.splash();
  P.x = P.safe.x; P.y = P.safe.y - 2; P.vx = 0; P.vy = 0; P.sx = 1.3; P.sy = 0.7;
  for (let i = 0; i < 10; i++) parts.push({ x: P.x + P.w / 2, y: P.y + P.h / 2, vx: (Math.random() - 0.5) * 240, vy: (Math.random() - 0.7) * 240, life: 0.6, max: 0.6, size: 4, color: C.purple, g: 300 });
}

/* ---------------- interactions ---------------- */
function hitMarker(m) {
  m.bump = 1; shake = Math.max(shake, 3);
  sparkleBurst(m.x * TILE + 20, m.y * TILE, m.kind === 'egg' ? C.purple : C.gold, 10);
  if (m.kind === 'egg') {
    if (!m.revealed) { m.revealed = true; save.egg = true; persist(); }
    sfx.open();
    setTimeout(() => openCard(CONTENT.easterEgg, { eyebrow: 'Hidden marker', secret: true }), 160);
  } else {
    sfx.open();
    setTimeout(() => openMarkerCard(m.idx), 160);
  }
}
function openMarkerCard(idx) {
  const w = L.world, card = w.cards[idx];
  if (!card) return;
  mark('read', `${w.id}-${idx}`);
  updateHud();
  openCard(card, { eyebrow: `World ${w.id} · Card ${idx + 1} of ${w.cards.length}` });
}
function interact() {
  const pcx = P.x + P.w / 2, pcy = P.y + P.h / 2;
  nearTarget = null;
  // markers within reach
  let best = null, bd = 1e9;
  for (const m of [...L.markers, ...L.hidden.filter(h => h.revealed)]) {
    const mx = m.x * TILE + 20, my = m.y * TILE + 20;
    const dx = Math.abs(mx - pcx), dy = pcy - my;
    if (dx < 64 && dy > -40 && dy < 190 && dx < bd) { bd = dx; best = m; }
  }
  if (best) nearTarget = { type: 'marker', m: best, x: best.x * TILE + 20, y: best.y * TILE - 10, label: best.kind === 'egg' ? 'Read' : 'Read' };

  // items
  for (const it of L.items) {
    const id = L.world.items[it.idx] && L.world.items[it.idx].id;
    if (!id || it.taken) continue;
    const ix = it.x * TILE + 6, iy = it.y * TILE + 4 + Math.sin(time * 3 + it.t) * 5;
    if (pcx > ix - 16 && pcx < ix + 44 && P.y < iy + 34 && P.y + P.h > iy) collectItem(it);
  }

  // ranger station
  if (L.ranger && L.world.quiz) {
    const rx = L.ranger.x * TILE + 40;
    const d = Math.abs(pcx - rx);
    if (d > 130) rangerZone = false;             // re-arm once they walk away
    if (d < 70 && P.ground && !rangerZone) { rangerZone = true; if (!save.quiz.includes(L.world.id)) openQuiz(); }
    if (Math.abs(pcx - rx) < 110 && !nearTarget) nearTarget = { type: 'quiz', x: rx, y: (L.ranger.y + 1) * TILE - 120, label: 'Quiz' };
  }
  // basecamps
  let inCamp = -1;
  for (const c of L.camps) {
    const cx = c.x * TILE + 20;
    if (Math.abs(pcx - cx) < 60 && P.ground) inCamp = c.idx;
    if (Math.abs(pcx - cx) < 90 && !nearTarget) nearTarget = { type: 'camp', c, x: cx, y: (c.y + 1) * TILE - 96, label: 'Basecamp' };
  }
  if (inCamp >= 0 && campZone !== inCamp) openBasecamp(inCamp);
  campZone = inCamp;
  // exit
  if (L.exit) {
    const ex = L.exit.x * TILE + 20;
    const inExit = pcx > ex - 10;
    if (inExit && !exitZone) completeWorld();
    exitZone = inExit;
  }
  if (actQueued) {
    actQueued = false;
    if (nearTarget) {
      if (nearTarget.type === 'marker') { const m = nearTarget.m; m.bump = 1; sfx.open(); m.kind === 'egg' ? openCard(CONTENT.easterEgg, { eyebrow: 'Hidden marker', secret: true }) : openMarkerCard(m.idx); }
      else if (nearTarget.type === 'quiz') openQuiz();
      else if (nearTarget.type === 'camp') openBasecamp(nearTarget.c.idx);
    }
  }
}
function collectItem(it) {
  it.taken = true;
  const item = L.world.items[it.idx];
  const fresh = !save.items.includes(item.id);
  mark('items', item.id);
  sparkleBurst(it.x * TILE + 20, it.y * TILE + 20, C.purple, 18);
  sparkleBurst(it.x * TILE + 20, it.y * TILE + 20, C.gold, 10);
  sfx.item(); updateHud();
  setTimeout(() => openItem(item, fresh), 220);

/* ---------------- particles ---------------- */
function dust(x, y, n) { for (let i = 0; i < n; i++) parts.push({ x: x + (Math.random() - 0.5) * 16, y: y - 2, vx: (Math.random() - 0.5) * 140, vy: -Math.random() * 70, life: 0.45, max: 0.45, size: 5 + Math.random() * 5, color: 'rgba(235,228,214,', type: 'dust', g: -40 }); }
function sparkleBurst(x, y, color, n) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 220; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.7, max: 0.7, size: 3 + Math.random() * 3, color, type: 'spark', g: 380 }); } }
function splash(x, y) { for (let i = 0; i < 18; i++) parts.push({ x: x + (Math.random() - 0.5) * 20, y, vx: (Math.random() - 0.5) * 220, vy: -150 - Math.random() * 300, life: 0.8, max: 0.8, size: 3 + Math.random() * 3, color: '#cfe6f2', type: 'spark', g: 900 }); }
function confetti(x, y, n = 70) { const cols = [C.gold, C.red, C.purple, '#fff']; for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6, s = 250 + Math.random() * 450; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1.8 + Math.random(), max: 2.6, size: 5 + Math.random() * 4, color: cols[i % 4], type: 'conf', g: 520, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14 }); } }
function updateParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === 'conf') { p.vx *= 0.99; p.vy = Math.min(p.vy, 160); p.rot += p.vr * dt; }
    if (p.type === 'dust') { p.vx *= 0.9; p.size += dt * 10; }
  }
}

/* ---------------- drawing: background ---------------- */
function halfDomePath(c, x, base, s) {
  // rounded dome on the left, sheer flat face on the right
  c.beginPath();
  c.moveTo(x - 420 * s, base);
  c.bezierCurveTo(x - 330 * s, base - 30 * s, x - 260 * s, base - 70 * s, x - 210 * s, base - 120 * s);
  c.bezierCurveTo(x - 150 * s, base - 250 * s, x - 40 * s, base - 300 * s, x + 60 * s, base - 296 * s);
  c.bezierCurveTo(x + 110 * s, base - 292 * s, x + 140 * s, base - 280 * s, x + 152 * s, base - 266 * s);
  c.lineTo(x + 150 * s, base - 200 * s);
  c.lineTo(x + 158 * s, base - 120 * s);

  for (const p of L.pines) if (p.x * TILE > cam.x - 100 && p.x * TILE < cam.x + VW + 100) drawPine(c, p.x * TILE + 20, (p.y + 1) * TILE, p.h, th.pine);
  for (const s of L.signs) drawSign(s.x * TILE, (s.y + 1) * TILE, L.world.stage);
  if (L.exit) { const nxt = CONTENT.worlds[worldIdx + 1]; drawSign(L.exit.x * TILE, (L.exit.y + 1) * TILE, nxt ? nxt.place : 'Summit', true); }
  if (L.ranger) drawRanger(L.ranger);
  for (const cp of L.camps) drawCamp(cp);
  drawTiles(th);
  for (const it of L.items) drawItem(it);
  drawPlayer();
  drawParticles();
  drawPrompt();
  c.restore();
}

/* ---------------- loop ---------------- */
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  while (acc >= STEP) { if (L) update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}

function wireCopy(root, text) {
  root.querySelectorAll('[data-copy]').forEach(btn => btn.addEventListener('click', async e => {
    e.stopPropagation();
    const out = btn.parentElement.querySelector('.copied') || btn.closest('.pitem, .litem, .item').querySelector('.copied');
    const pre = btn.closest('.pitem, .litem, .item').querySelector('.prompt');
    const t = btn.dataset.text ? decodeURIComponent(btn.dataset.text) : text;
    let ok = false;
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); ok = true; } } catch (err) {}
    if (!ok) {
      try {
        const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
        ok = document.execCommand('copy'); ta.remove();
      } catch (err) {}
    }
    if (ok) { if (out) out.textContent = 'Copied. Paste it into Claude.'; btn.textContent = 'Copied'; sfx.open(); setTimeout(() => btn.textContent = 'Copy', 1600); }
    else if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); if (out) out.textContent = 'Selected. Press Ctrl+C or Cmd+C to copy.'; }
    btn.blur();
  }));
}

/* ranger quiz */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function openQuiz() {
  const w = L.world, q = w.quiz; if (!q) return;
  const done = save.quiz.includes(w.id);
  const opts = shuffle(q.options);
  const node = el(`<div class="overlay"><div class="panel quiz red" role="dialog" aria-modal="true" aria-label="Ranger station">
    <div class="eyebrow"><span class="tag red">Ranger station</span>World ${w.id} check-in${done ? ' · flag already raised' : ''}</div>
    <h2>${inline(q.question)}</h2>
    <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}"><kbd>${i + 1}</kbd><span>${inline(o.text)}</span></button>`).join('')}</div>
    <div class="why" aria-live="polite"></div>
    <div class="foot" style="display:flex;justify-content:space-between;align-items:center"><span class="closehint">Answer with <kbd>1</kbd>-<kbd>4</kbd> · Skip <kbd>Esc</kbd></span><button class="btn gold" data-raise style="display:none">Raise the flag</button></div>
  </div></div>`);
  const why = $('.why', node), raise = $('[data-raise]', node);
  let solved = false;
  const pick = i => {
    if (solved) return;
    const o = opts[i], b = node.querySelectorAll('.opt')[i];
    if (!o) return;
    if (o.correct) {
      solved = true; b.classList.add('right');
      node.querySelectorAll('.opt').forEach(x => x.disabled = true);
      why.className = 'why show good'; why.innerHTML = `<b>That's it.</b> ${inline(o.why)}`;
      raise.style.display = ''; raise.focus(); sfx.right();
    } else {
      b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
      why.className = 'why show bad'; why.innerHTML = `<b>Not quite.</b> ${inline(o.why)} Try again.`;
      sfx.wrong();
    }
  };
  node.querySelectorAll('.opt').forEach((b, i) => b.addEventListener('click', () => pick(i)));
  const finish = () => { closeOverlay(); };
  raise.addEventListener('click', finish);
  const cur = openOverlay(node, { kind: 'quiz', enterCloses: false, pick, onClose: () => { if (solved) raiseFlag(); } });
  cur.raiseReady = () => solved;
}
function raiseFlag() {
  const w = L.world, r = L.ranger;
  const first = !save.quiz.includes(w.id);
  mark('quiz', w.id); updateHud();
  if (r) { r.raised = true; r.flag = first ? 0 : r.flag; }
  shake = 9;
  if (r) { const fx = r.x * TILE - 40 + 168; setTimeout(() => confetti(fx, (r.y + 1) * TILE - 200, 80), 500); }
  toast('Flag raised. Onward.');
}

  wireCopy(list);
  $('[data-back]', list).addEventListener('click', () => toggleList(false));
  list.querySelectorAll('.lnav a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); const t = $(a.getAttribute('href'), list); if (t) list.scrollTo({ top: t.offsetTop - 70, behavior: 'smooth' }); }));
  function campHTML(bc) { return `<div class="camp-l"><b>Basecamp.</b> ${esc(CONTENT.basecampHeadline)}. ${inline(bc.text)}</div>`; }
  function itemHTML(it) { return `<div class="litem"><h3>${esc(it.title)} <button class="btn gold small" data-copy data-text="${encodeURIComponent(it.text)}">Copy</button></h3>${it.note ? `<p class="note" style="display:inline-block;margin-bottom:8px">${esc(it.note)}</p>` : ''}<pre class="prompt">${promptHTML(it.text)}</pre><span class="copied" aria-live="polite"></span></div>`; }
  function itemsFor(w, sec) { const map = { '5a': 'week-ahead', '5b': 'mi-to-monday', '5c': 'wip-wrapup' }; const id = map[sec.slice(0, 2)]; const it = w.items.find(i => i.id === id); return it ? itemHTML(it) : ''; }
}
function openList() { toggleList(true); }
function toggleList(on) {
  if (on) { buildList(); list.classList.add('on'); list.scrollTop = 0; overlayOpen = true; $('[data-back]', list).focus(); }
  else { list.classList.remove('on'); overlayOpen = !!current; }
}

/* ---------------- keyboard ---------------- */
const isListOpen = () => list.classList.contains('on');
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (isListOpen()) {
    if (k === 'escape' || (k === 'l' && !e.target.closest('input,textarea'))) { e.preventDefault(); toggleList(false); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (current) {
    if (e.repeat) return;
    if (k === 'escape') { e.preventDefault(); closeOverlay(); return; }
    if (k === 'enter' && current.enterCloses && !e.target.closest('button,a')) { e.preventDefault(); closeOverlay(); return; }
    if (k === 'enter' && current.kind === 'quiz' && current.raiseReady && current.raiseReady()) { e.preventDefault(); closeOverlay(); return; }
    if (current.kind === 'quiz' && /^[1-4]$/.test(k)) { current.pick(+k - 1); return; }
    if (k === 'm') { e.preventDefault(); current.kind === 'map' ? closeOverlay() : openMap(); return; }
    if (k === 'b') { e.preventDefault(); current.kind === 'pack' ? closeOverlay() : openBackpack(); return; }
    if (k === 'l') { e.preventDefault(); openList(); return; }
    if (k === ' ' || k.startsWith('arrow')) e.preventDefault();
    return;
  }
  switch (k) {
    case 'arrowleft': case 'a': keys.left = true; break;
    case 'arrowright': case 'd': keys.right = true; break;
    case ' ': case 'arrowup': case 'w': case 'z': if (!e.repeat) jumpQueued = true; keys.jump = true; break;
    case 'e': case 'enter': if (!e.repeat) actQueued = true; break;
    case 'm': openMap(); break;
    case 'b': openBackpack(); break;
    case 'l': openList(); break;
    default: return;
  }
  e.preventDefault();
  hideHelpSoon();
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') keys.left = false;
  if (k === 'arrowright' || k === 'd') keys.right = false;
  if (k === ' ' || k === 'arrowup' || k === 'w' || k === 'z') keys.jump = false;
});
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; });
let helpT = 0;
function hideHelpSoon() { if (helpT) return; helpT = setTimeout(() => $('#help').style.opacity = '0', 9000); }

/* touch */
const touchEl = $('#touch');
if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) touchEl.classList.add('on');
touchEl.querySelectorAll('.tbtn').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); b.classList.add('down'); if (k === 'left') keys.left = true; if (k === 'right') keys.right = true; if (k === 'jump') { keys.jump = true; jumpQueued = true; } if (k === 'act') actQueued = true; };
  const up = e => { e.preventDefault(); b.classList.remove('down'); if (k === 'left') keys.left = false; if (k === 'right') keys.right = false; if (k === 'jump') keys.jump = false; };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
});

/* HUD buttons */
$('#btnMap').addEventListener('click', e => { e.currentTarget.blur(); current && current.kind === 'map' ? closeOverlay() : openMap(); });
$('#btnPack').addEventListener('click', e => { e.currentTarget.blur(); current && current.kind === 'pack' ? closeOverlay() : openBackpack(); });
$('#btnList').addEventListener('click', e => { e.currentTarget.blur(); openList(); });
$('#btnSound').addEventListener('click', e => { e.currentTarget.blur(); save.sound = !save.sound; persist(); updateHud(); if (save.sound) sfx.open(); });

/* ---------------- routing + boot ---------------- */
function worldFromHash() { const m = location.hash.match(/^#world-(\d)/); return m ? +m[1] : 0; }
addEventListener('hashchange', () => {
  const id = worldFromHash();
  if (id && (!L || L.world.id !== id)) { closeOverlay(true); if (isListOpen()) toggleList(false); if (!loadWorld(id)) openMap(id); }
});
function boot() {
  const id = worldFromHash();
  if (id && CONTENT.worlds.find(w => w.id === id && w.level)) { loadWorld(id); }
  else {
    loadWorld(1); started = false;
    if (id) { openMap(id); toast(`World ${id} opens in the next build`); }
    else openTitle();
  }
  updateHud();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}
// expose a tiny hook for automated checks
window.__summit = { P, get L() { return L; }, save, loadWorld, keys, get current() { return current; } };
boot();
})();
